<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Müller-Lyer Experiment</title>
<style>
body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;margin:0;background:#f7f8fa;color:#111827}
main{max-width:900px;margin:0 auto;padding:28px}
h1{font-size:32px;margin:0 0 6px} p{font-size:18px;color:#4b5563}
.card{background:white;border:1px solid #d1d5db;border-radius:16px;padding:20px}
svg{width:100%;height:auto;display:block}
button{font-size:17px;padding:10px 16px;border-radius:10px;border:1px solid #9ca3af;background:#fff;cursor:pointer;margin-right:8px}
.reveal{opacity:0;transition:opacity .25s}.shown .reveal{opacity:1}
.answer{font-weight:700;color:#111827;min-height:28px;margin-top:12px}
</style>
</head><body><main>
<h1>Which line is longer?</h1>
<p>Choose before revealing the measurement.</p>
<div class="card" id="demo">
<svg viewBox="0 0 900 520" aria-label="Müller-Lyer illusion">
<g stroke="#111827" stroke-width="12" stroke-linecap="round" fill="none">
<line x1="280" y1="130" x2="280" y2="390"/>
<line x1="190" y1="220" x2="280" y2="130"/><line x1="370" y1="220" x2="280" y2="130"/>
<line x1="190" y1="300" x2="280" y2="390"/><line x1="370" y1="300" x2="280" y2="390"/>
<line x1="620" y1="130" x2="620" y2="390"/>
<line x1="555" y1="65" x2="620" y2="130"/><line x1="685" y1="65" x2="620" y2="130"/>
<line x1="555" y1="455" x2="620" y2="390"/><line x1="685" y1="455" x2="620" y2="390"/>
</g>
<g class="reveal" stroke="#e11d48" stroke-width="4" stroke-dasharray="10 8">
<line x1="120" y1="130" x2="780" y2="130"/><line x1="120" y1="390" x2="780" y2="390"/>
</g>
</svg>
<button onclick="document.getElementById('demo').classList.add('shown');document.getElementById('ans').textContent='Same length — the fins change perceived length.'">Reveal measurement</button>
<button onclick="document.getElementById('demo').classList.remove('shown');document.getElementById('ans').textContent=''">Reset</button>
<div id="ans" class="answer"></div>
</div>
</main></body></html>
