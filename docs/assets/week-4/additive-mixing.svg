<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">additive mixing</title><desc id="desc">Ideal additive color mixing. Equations give pairwise and triple mixtures.</desc><style>text{font-family:Arial,sans-serif;fill:#172235}.small{font-size:19px}.label{font-size:25px}.title{font-size:33px;font-weight:700}</style><rect width="1200" height="620" fill="white"/><text x="45" y="55" class="title" >Add light: RGB</text><rect x="55" y="95" width="520" height="440" rx="20" fill="#000000"/><defs><clipPath id="c0"><circle cx="250" cy="270" r="140"/></clipPath><clipPath id="c1"><circle cx="375" cy="270" r="140"/></clipPath><clipPath id="c2"><circle cx="310" cy="375" r="140"/></clipPath></defs><circle cx="250" cy="270" r="140" fill="#ff0000"/><circle cx="375" cy="270" r="140" fill="#00ff00"/><circle cx="310" cy="375" r="140" fill="#0000ff"/><circle cx="250" cy="270" r="140" fill="#ffff00" clip-path="url(#c1)"/><circle cx="250" cy="270" r="140" fill="#ff00ff" clip-path="url(#c2)"/><circle cx="375" cy="270" r="140" fill="#00ffff" clip-path="url(#c2)"/><g clip-path="url(#c0)"><g clip-path="url(#c1)"><circle cx="310" cy="375" r="140" fill="#ffffff"/></g></g><text x="630" y="165" class="label" >Red + Green = Yellow</text><text x="630" y="240" class="label" >Green + Blue = Cyan</text><text x="630" y="315" class="label" >Blue + Red = Magenta</text><text x="630" y="390" class="label" >Red + Green + Blue = White</text><text x="630" y="465" class="small" >Complements: R–C, G–M, B–Y</text></svg>