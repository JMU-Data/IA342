<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">Hue saturation and value</title><desc id="desc">Three rows vary hue, saturation and value independently.</desc><style>text{font-family:Arial,sans-serif;fill:#172235}.small{font-size:19px}.label{font-size:25px}.title{font-size:33px;font-weight:700}</style><rect width="1200" height="620" fill="white"/><text x="45" y="55" class="title" >Change one component at a time</text><text x="45" y="150" class="label" >Hue</text><rect x="245" y="105" width="88" height="82" fill="#ff0000"/><rect x="333" y="105" width="88" height="82" fill="#ff9900"/><rect x="421" y="105" width="88" height="82" fill="#ccff00"/><rect x="509" y="105" width="88" height="82" fill="#33ff00"/><rect x="597" y="105" width="88" height="82" fill="#00ff66"/><rect x="685" y="105" width="88" height="82" fill="#00ffff"/><rect x="773" y="105" width="88" height="82" fill="#0066ff"/><rect x="861" y="105" width="88" height="82" fill="#3300ff"/><rect x="949" y="105" width="88" height="82" fill="#cc00ff"/><rect x="1037" y="105" width="88" height="82" fill="#ff0099"/><text x="45" y="295" class="label" >Saturation</text><rect x="245" y="250" width="88" height="82" fill="#ffffff"/><rect x="333" y="250" width="88" height="82" fill="#e3eeff"/><rect x="421" y="250" width="88" height="82" fill="#c6ddff"/><rect x="509" y="250" width="88" height="82" fill="#aaccff"/><rect x="597" y="250" width="88" height="82" fill="#8ebbff"/><rect x="685" y="250" width="88" height="82" fill="#71aaff"/><rect x="773" y="250" width="88" height="82" fill="#5599ff"/><rect x="861" y="250" width="88" height="82" fill="#3988ff"/><rect x="949" y="250" width="88" height="82" fill="#1c77ff"/><rect x="1037" y="250" width="88" height="82" fill="#0066ff"/><text x="45" y="440" class="label" >HSV value</text><rect x="245" y="395" width="88" height="82" fill="#000000"/><rect x="333" y="395" width="88" height="82" fill="#000b1c"/><rect x="421" y="395" width="88" height="82" fill="#001739"/><rect x="509" y="395" width="88" height="82" fill="#002255"/><rect x="597" y="395" width="88" height="82" fill="#002d71"/><rect x="685" y="395" width="88" height="82" fill="#00398e"/><rect x="773" y="395" width="88" height="82" fill="#0044aa"/><rect x="861" y="395" width="88" height="82" fill="#004fc6"/><rect x="949" y="395" width="88" height="82" fill="#005be3"/><rect x="1037" y="395" width="88" height="82" fill="#0066ff"/><text x="45" y="570" class="small" >HSV value is a control coordinate—not a perceptually uniform lightness scale.</text></svg>