<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#fff"/><style>.t{font-family:Arial,Helvetica,sans-serif;fill:#1f2937}.h{font-size:34px;font-weight:700}.l{font-size:22px;font-weight:700}.m{font-size:18px}.sm{font-size:15px;fill:#4b5563}</style><text x="60" y="58" class="t h">Three ways to express map scale</text><g transform="translate(80,165)"><rect width="310" height="310" rx="18" fill="#f8fafc" stroke="#cbd5e1"/><text x="155" y="55" text-anchor="middle" class="t l">Word statement</text><text x="155" y="135" text-anchor="middle" class="t" style="font-size:30px;font-weight:700">1 inch = 1 mile</text><text x="155" y="215" text-anchor="middle" class="t sm">easy to read</text><rect x="365" width="310" height="310" rx="18" fill="#f8fafc" stroke="#cbd5e1"/><text x="520" y="55" text-anchor="middle" class="t l">Representative fraction</text><text x="520" y="135" text-anchor="middle" class="t" style="font-size:36px;font-weight:700">1 : 63,360</text><text x="520" y="215" text-anchor="middle" class="t sm">smaller denominator = larger scale</text><rect x="730" width="310" height="310" rx="18" fill="#f8fafc" stroke="#cbd5e1"/><text x="885" y="55" text-anchor="middle" class="t l">Graphic scale</text><line x1="790" y1="150" x2="980" y2="150" stroke="#111827" stroke-width="8"/><line x1="790" y1="135" x2="790" y2="165" stroke="#111827" stroke-width="4"/><line x1="885" y1="135" x2="885" y2="165" stroke="#111827" stroke-width="4"/><line x1="980" y1="135" x2="980" y2="165" stroke="#111827" stroke-width="4"/><text x="790" y="195" text-anchor="middle" class="t sm">0</text><text x="885" y="195" text-anchor="middle" class="t sm">1</text><text x="980" y="195" text-anchor="middle" class="t sm">2 miles</text><text x="885" y="240" text-anchor="middle" class="t sm">resizes with the map</text></g></svg>