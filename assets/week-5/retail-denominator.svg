<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 485" role="img" aria-labelledby="title desc"><title id="title">Same pharmacy sales, a different denominator</title><desc id="desc">Revenue amount and within-company revenue share answer different questions.</desc><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif" fill="#203440"><text x="32.00" y="40.00" font-size="26" fill="#203440" text-anchor="start" font-weight="700">Same pharmacy sales, a different denominator</text><text x="32.00" y="70.00" font-size="18" fill="#536b7a" text-anchor="start" font-weight="400">Revenue amount and within-company revenue share answer different questions.</text><text x="80.00" y="125.00" font-size="23" fill="#203440" text-anchor="start" font-weight="700">FY 2019</text><text x="80.00" y="172.00" font-size="21" fill="#203440" text-anchor="start" font-weight="400">Pharmacy sales: $11.015B</text><text x="80.00" y="212.00" font-size="21" fill="#203440" text-anchor="start" font-weight="400">All sales: $122.286B</text><rect x="80.00" y="250.00" width="430.00" height="54.00" fill="#d8e4ea" stroke="none"/><rect x="80.00" y="250.00" width="38.73" height="54.00" fill="#23658a" stroke="none"/><text x="80.00" y="341.00" font-size="25" fill="#203440" text-anchor="start" font-weight="700">9.0% of the annual total</text><text x="80.00" y="376.00" font-size="17" fill="#536b7a" text-anchor="start" font-weight="400">The whole bar is 100% of that year’s sales.</text><text x="680.00" y="125.00" font-size="23" fill="#203440" text-anchor="start" font-weight="700">FY 2020</text><text x="680.00" y="172.00" font-size="21" fill="#203440" text-anchor="start" font-weight="400">Pharmacy sales: $11.388B</text><text x="680.00" y="212.00" font-size="21" fill="#203440" text-anchor="start" font-weight="400">All sales: $132.498B</text><rect x="680.00" y="250.00" width="430.00" height="54.00" fill="#d8e4ea" stroke="none"/><rect x="680.00" y="250.00" width="36.96" height="54.00" fill="#23658a" stroke="none"/><text x="680.00" y="341.00" font-size="25" fill="#203440" text-anchor="start" font-weight="700">8.6% of the annual total</text><text x="680.00" y="376.00" font-size="17" fill="#536b7a" text-anchor="start" font-weight="400">The whole bar is 100% of that year’s sales.</text><line x1="32" y1="428" x2="1168" y2="428" stroke="#d4dfe5" stroke-width="1" stroke-dasharray=""/><text x="32.00" y="454.00" font-size="15" fill="#536b7a" text-anchor="start" font-weight="400">Here the denominator is total sales. On the next page, it is a performance target — a different question.</text><a href="https://www.sec.gov/Archives/edgar/data/56873/000155837021003706/R10.htm"><text x="32" y="475" font-size="14" fill="#175d7b">Source: The Kroger Co., FY 2020 Form 10-K, Note 1 — Disaggregated Revenues (SEC).</text></a></g></svg>