<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-label="Sankey: follow quantities through a system"><title>Sankey: follow quantities through a system</title><rect width="1200" height="620" fill="white"/><g font-family="Arial, sans-serif" fill="#173442"><text x="36" y="44" font-size="27" fill="#173442" text-anchor="start" font-weight="700">Sankey: follow quantities through a system</text><text x="36" y="76" font-size="17" fill="#5E707A" text-anchor="start">Illustrative energy balance • arbitrary units, not a national energy account</text><rect x="70" y="195" width="35" height="250" rx="0" fill="#276B83"/><text x="70" y="165" font-size="25" fill="#173442" text-anchor="start" font-weight="700">Supply 100</text><path d="M105 195 C400 195 550 165 880 165 L880 315 C550 315 400 345 105 345 Z" fill="#659A82" stroke="none" stroke-width="3"/><path d="M105 345 C400 345 550 415 880 415 L880 515 C550 515 400 445 105 445 Z" fill="#DD8751" stroke="none" stroke-width="3"/><rect x="880" y="165" width="30" height="150" rx="0" fill="#659A82"/><rect x="880" y="415" width="30" height="100" rx="0" fill="#DD8751"/><text x="940" y="235" font-size="24" fill="#173442" text-anchor="start">Useful energy</text><text x="940" y="270" font-size="24" fill="#173442" text-anchor="start" font-weight="700">60 units</text><text x="940" y="463" font-size="24" fill="#173442" text-anchor="start">Losses</text><text x="940" y="498" font-size="24" fill="#173442" text-anchor="start" font-weight="700">40 units</text><text x="36" y="598" font-size="17" fill="#5E707A" text-anchor="start">Widths encode flow: 60 + 40 = 100. A link connects quantities across stages.</text></g></svg>