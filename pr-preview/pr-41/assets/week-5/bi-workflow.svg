<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 490" role="img" aria-label="From charts to a business-intelligence workflow"><title>From charts to a business-intelligence workflow</title><rect width="1200" height="490" fill="white"/><g font-family="Arial, sans-serif" fill="#173442"><text x="36" y="44" font-size="27" fill="#173442" text-anchor="start" font-weight="700">From charts to a business-intelligence workflow</text><text x="36" y="76" font-size="17" fill="#5E707A" text-anchor="start">A conceptual workflow, not a product interface screenshot</text><rect x="35" y="180" width="254" height="155" rx="12" fill="#F2F6F7" stroke="#DBE4E8"/><text x="162" y="239" font-size="28" fill="#173442" text-anchor="middle" font-weight="700">Connect</text><text x="162" y="284" font-size="18" fill="#173442" text-anchor="middle">Tables and files</text><text x="307" y="271" font-size="32" fill="#276B83" text-anchor="middle" font-weight="700">→</text><rect x="333" y="180" width="254" height="155" rx="12" fill="#F2F6F7" stroke="#DBE4E8"/><text x="460" y="239" font-size="28" fill="#173442" text-anchor="middle" font-weight="700">Explore</text><text x="460" y="284" font-size="18" fill="#173442" text-anchor="middle">Ask and compare</text><text x="605" y="271" font-size="32" fill="#276B83" text-anchor="middle" font-weight="700">→</text><rect x="631" y="180" width="254" height="155" rx="12" fill="#F2F6F7" stroke="#DBE4E8"/><text x="758" y="239" font-size="28" fill="#173442" text-anchor="middle" font-weight="700">Build</text><text x="758" y="284" font-size="18" fill="#173442" text-anchor="middle">Sheets and dashboards</text><text x="903" y="271" font-size="32" fill="#276B83" text-anchor="middle" font-weight="700">→</text><rect x="929" y="180" width="254" height="155" rx="12" fill="#F2F6F7" stroke="#DBE4E8"/><text x="1056" y="239" font-size="28" fill="#173442" text-anchor="middle" font-weight="700">Share</text><text x="1056" y="284" font-size="18" fill="#173442" text-anchor="middle">Controlled access</text><text x="36" y="468" font-size="17" fill="#5E707A" text-anchor="start">Software supplies the controls; the analyst still checks measures, scales, and claims.</text></g></svg>