<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">subtractive mixing</title><desc id="desc">Ideal subtractive color mixing. Equations give pairwise and triple mixtures.</desc><style>text{font-family:Arial,sans-serif;fill:#172235}.small{font-size:19px}.label{font-size:25px}.title{font-size:33px;font-weight:700}</style><rect width="1200" height="620" fill="white"/><text x="45" y="55" class="title" >Filter light: CMY</text><rect x="55" y="95" width="520" height="440" rx="20" fill="#ffffff"/><defs><clipPath id="c0"><circle cx="250" cy="270" r="140"/></clipPath><clipPath id="c1"><circle cx="375" cy="270" r="140"/></clipPath><clipPath id="c2"><circle cx="310" cy="375" r="140"/></clipPath></defs><circle cx="250" cy="270" r="140" fill="#00ffff"/><circle cx="375" cy="270" r="140" fill="#ff00ff"/><circle cx="310" cy="375" r="140" fill="#ffff00"/><circle cx="250" cy="270" r="140" fill="#0000ff" clip-path="url(#c1)"/><circle cx="250" cy="270" r="140" fill="#00ff00" clip-path="url(#c2)"/><circle cx="375" cy="270" r="140" fill="#ff0000" clip-path="url(#c2)"/><g clip-path="url(#c0)"><g clip-path="url(#c1)"><circle cx="310" cy="375" r="140" fill="#000000"/></g></g><text x="630" y="165" class="label" >Cyan + Magenta = Blue</text><text x="630" y="240" class="label" >Magenta + Yellow = Red</text><text x="630" y="315" class="label" >Yellow + Cyan = Green</text><text x="630" y="390" class="label" >Cyan + Magenta + Yellow = Black</text><text x="630" y="465" class="small" >Ideal filters; real printing often adds K ink.</text></svg>