<text x="530" y="260" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="400" fill="#18212F" text-anchor="start" >7.5</text>
<text x="730" y="260" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="400" fill="#18212F" text-anchor="start" >0.816</text>
<text x="930" y="260" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="400" fill="#18212F" text-anchor="start" >y ≈ 3 + 0.5x</text>
