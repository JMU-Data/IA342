<text x="530" y="205" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" fill="#667085" text-anchor="start" >Mean y</text>
<text x="730" y="205" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" fill="#667085" text-anchor="start" >Correlation</text>
<text x="930" y="205" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" fill="#667085" text-anchor="start" >Regression</text>
