<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">Visible spectrum and perception</title><desc id="desc">Schematic 380–700 nm range, reflected light reaching the eye. Colors are screen approximations, not calibrated spectral measurements.</desc><style>text{font-family:Arial,sans-serif;fill:#172235}.small{font-size:19px}.label{font-size:25px}.title{font-size:33px;font-weight:700}</style><rect width="1200" height="620" fill="white"/><text x="45" y="50" class="title" >Visible light is a small part of the spectrum</text><rect x="100" y="130" width="140" height="100" fill="#7e22ce"/><rect x="240" y="130" width="140" height="100" fill="#4338ca"/><rect x="380" y="130" width="140" height="100" fill="#2563eb"/><rect x="520" y="130" width="140" height="100" fill="#16a34a"/><rect x="660" y="130" width="140" height="100" fill="#facc15"/><rect x="800" y="130" width="140" height="100" fill="#f97316"/><rect x="940" y="130" width="140" height="100" fill="#dc2626"/><text x="100" y="272" class="label" >~380 nm</text><text x="930" y="272" class="label" >~700 nm</text><text x="100" y="95" class="label" >Shorter wavelength</text><text x="850" y="95" class="label" >Longer wavelength</text><text x="90" y="355" class="title" >Light source → object / surface → eye → perception</text><text x="90" y="414" class="label" >A surface absorbs some wavelengths and reflects others.</text><text x="90" y="455" class="label" >S, M and L cones have overlapping sensitivities; the brain compares their responses.</text><text x="90" y="522" class="small" >The screen uses RGB approximations. Magenta is not a single wavelength.</text></svg>