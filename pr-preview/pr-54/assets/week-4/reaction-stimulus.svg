<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 650" role="img" aria-labelledby="title desc"><title id="title">Look. Pause. Describe.</title><desc id="desc">An unlabeled bright yellow rectangle invites an association before the source table is revealed.</desc><rect width="1050" height="650" fill="white"/><rect x="70" y="80" width="910" height="400" rx="15" fill="#ffff00" stroke="#495669" stroke-width="2"/><text x="525" y="555" text-anchor="middle" font-family="Arial,sans-serif" font-size="35" fill="#172235">What comes to mind?</text><text x="525" y="601" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#536176">Your response first. The source list comes later.</text></svg>