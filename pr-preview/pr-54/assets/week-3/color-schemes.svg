<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#fff"/><style>.t{font-family:Arial,Helvetica,sans-serif;fill:#1f2937}.h{font-size:34px;font-weight:700}.l{font-size:22px;font-weight:700}.m{font-size:18px}.sm{font-size:15px;fill:#4b5563}</style><text x="60" y="58" class="t h">Common uses of color in thematic maps</text><g transform="translate(55,170)"><g><text x="100" class="t l">Sequential</text><rect x="0" y="25" width="55" height="70" fill="#eff6ff"/><rect x="55" y="25" width="55" height="70" fill="#bfdbfe"/><rect x="110" y="25" width="55" height="70" fill="#60a5fa"/><rect x="165" y="25" width="55" height="70" fill="#1d4ed8"/></g><g transform="translate(235,0)"><text x="100" class="t l">Diverging</text><rect y="25" width="55" height="70" fill="#1d4ed8"/><rect x="55" y="25" width="55" height="70" fill="#93c5fd"/><rect x="110" y="25" width="55" height="70" fill="#f3f4f6"/><rect x="165" y="25" width="55" height="70" fill="#fb923c"/></g><g transform="translate(470,0)"><text x="100" class="t l">Categorical</text><circle cx="35" cy="60" r="25" fill="#2563eb"/><circle cx="95" cy="60" r="25" fill="#f59e0b"/><circle cx="155" cy="60" r="25" fill="#10b981"/></g><g transform="translate(705,0)"><text x="100" class="t l">Highlight</text><circle cx="35" cy="60" r="22" fill="#d1d5db"/><circle cx="95" cy="60" r="22" fill="#2563eb"/><circle cx="155" cy="60" r="22" fill="#d1d5db"/></g><g transform="translate(940,0)"><text x="80" class="t l">Alert</text><polygon points="80,28 120,98 40,98" fill="#ef4444"/><text x="80" y="80" text-anchor="middle" style="fill:white;font:700 28px Arial">!</text></g></g><text x="600" y="450" text-anchor="middle" class="t m">Color should encode the structure of the data or the task—not decorate the map.</text></svg>