<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <rect width="1200" height="675" fill="#f7f9fc"/>
  <text x="70" y="75" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" fill="#17324d">Same Data, Different Visual Impression</text>
  <text x="70" y="115" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#52677c">Historical example: top marginal income tax rate, 2012 vs. 2013</text>

  <g transform="translate(80,150)">
    <rect x="0" y="0" width="480" height="430" rx="18" fill="#ffffff" stroke="#d8e1ea" stroke-width="2"/>
    <text x="24" y="42" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#17324d">Truncated axis</text>
    <text x="24" y="73" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#6c7f92">Axis starts at 34%</text>
    <line x1="72" y1="340" x2="440" y2="340" stroke="#71869a" stroke-width="2"/>
    <line x1="72" y1="95" x2="72" y2="340" stroke="#71869a" stroke-width="2"/>
    <g font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#65798d">
      <text x="35" y="345">34</text><text x="35" y="285">36</text><text x="35" y="225">38</text><text x="35" y="165">40</text><text x="35" y="105">42</text>
    </g>
    <g stroke="#e4eaf0" stroke-width="1">
      <line x1="72" y1="280" x2="440" y2="280"/><line x1="72" y1="220" x2="440" y2="220"/><line x1="72" y1="160" x2="440" y2="160"/><line x1="72" y1="100" x2="440" y2="100"/>
    </g>
    <rect x="130" y="310" width="110" height="30" rx="4" fill="#3f7cac"/>
    <rect x="305" y="172" width="110" height="168" rx="4" fill="#3f7cac"/>
    <g font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#17324d">
      <text x="158" y="302">35%</text><text x="328" y="164">39.6%</text>
    </g>
    <g font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#52677c">
      <text x="157" y="375">2012</text><text x="332" y="375">2013</text>
    </g>
  </g>

  <g transform="translate(640,150)">
    <rect x="0" y="0" width="480" height="430" rx="18" fill="#ffffff" stroke="#d8e1ea" stroke-width="2"/>
    <text x="24" y="42" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#17324d">Zero baseline</text>
    <text x="24" y="73" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#6c7f92">Same values, axis starts at 0%</text>
    <line x1="72" y1="340" x2="440" y2="340" stroke="#71869a" stroke-width="2"/>
    <line x1="72" y1="95" x2="72" y2="340" stroke="#71869a" stroke-width="2"/>
    <g font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#65798d">
      <text x="42" y="345">0</text><text x="33" y="285">10</text><text x="33" y="225">20</text><text x="33" y="165">30</text><text x="33" y="105">40</text>
    </g>
    <g stroke="#e4eaf0" stroke-width="1">
      <line x1="72" y1="280" x2="440" y2="280"/><line x1="72" y1="220" x2="440" y2="220"/><line x1="72" y1="160" x2="440" y2="160"/><line x1="72" y1="100" x2="440" y2="100"/>
    </g>
    <rect x="130" y="130" width="110" height="210" rx="4" fill="#3f7cac"/>
    <rect x="305" y="102" width="110" height="238" rx="4" fill="#3f7cac"/>
    <g font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#17324d">
      <text x="158" y="122">35%</text><text x="328" y="94">39.6%</text>
    </g>
    <g font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#52677c">
      <text x="157" y="375">2012</text><text x="332" y="375">2013</text>
    </g>
  </g>

  <text x="600" y="625" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#17324d">The values did not change. The visual impression did.</text>
</svg>