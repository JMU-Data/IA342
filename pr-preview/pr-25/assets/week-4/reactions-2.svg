<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">Subjective reactions to color</title><desc id="desc">Selected phrases from the supplied instructor table. Full source wording appears in the classroom activity.</desc><style>text{font-family:Arial,sans-serif;fill:#172235}.small{font-size:19px}.label{font-size:25px}.title{font-size:33px;font-weight:700}</style><rect width="1200" height="620" fill="white"/><text x="40" y="50" class="title" >Subjective reactions: compare, do not grade</text><rect x="40" y="95" width="125" height="76" fill="#7030a0" stroke="#64748b"/><text x="192" y="123" class="label" >Purple</text><text x="192" y="156" class="small" >Royalty · richness · sorrow</text><rect x="40" y="201" width="125" height="76" fill="#ffffff" stroke="#64748b"/><text x="192" y="229" class="label" >White</text><text x="192" y="262" class="small" >Cleanliness · faith · purity · sickness</text><rect x="40" y="307" width="125" height="76" fill="#bfbfbf" stroke="#64748b"/><text x="192" y="335" class="label" >Gray</text><text x="192" y="368" class="small" >Quiet · reserved · controlled emotions</text><rect x="40" y="413" width="125" height="76" fill="#000000" stroke="#64748b"/><text x="192" y="441" class="label" >Black</text><text x="192" y="474" class="small" >Mystery · strength · mourning · heaviness</text><text x="40" y="555" class="small" >Selected associations from the textbook table in Wei’s lecture, slide 11.</text><text x="40" y="585" class="small" >They are discussion prompts, not universal emotional responses.</text></svg>