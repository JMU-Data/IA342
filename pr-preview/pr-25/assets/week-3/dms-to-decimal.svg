<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Degrees minutes seconds to decimal degrees</title>
<desc id="desc">Degrees minutes seconds to decimal degrees</desc>
<defs>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#101828" flood-opacity="0.10"/></filter>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L12,6 L0,12 z" fill="#667085"/></marker>
  <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L12,6 L0,12 z" fill="#3559E0"/></marker>
</defs>
<rect width="1200" height="675" fill="#F7F8FA"/>
<text x="70" y="68" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="700" fill="#18212F" text-anchor="start" opacity="1.0">The same coordinate can use different notation</text>
<text x="70" y="103" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="400" fill="#667085" text-anchor="start" opacity="1.0">Most analysis tools work best with decimal degrees.</text>
<rect x="85" y="190" width="430" height="320" rx="20" fill="#FFFFFF" stroke="#D9DEE7" stroke-width="2" opacity="1.0" filter="url(#shadow)"/><rect x="135" y="230" width="330" height="42" rx="21" fill="#FFF2E8" stroke="#FFF2E8" stroke-width="0" opacity="1.0"/><text x="300.0" y="258" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" fill="#E07A2D" text-anchor="middle" opacity="1.0">Degrees · Minutes · Seconds</text>
<text x="300" y="325" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="800" fill="#18212F" text-anchor="middle" opacity="1.0">38° 26′ 11″ N</text>
<text x="300" y="380" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="800" fill="#18212F" text-anchor="middle" opacity="1.0">78° 52′ 03″ W</text>
<text x="300" y="445" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="500" fill="#667085" text-anchor="middle">
  <tspan x="300" dy="0">Easy to read as a traditional</tspan>
  <tspan x="300" dy="25">geographic notation</tspan>
</text>
<line x1="535" y1="350" x2="665" y2="350" stroke="#667085" stroke-width="4" opacity="1.0" marker-end="url(#arrow)"/><rect x="685" y="190" width="430" height="320" rx="20" fill="#FFFFFF" stroke="#D9DEE7" stroke-width="2" opacity="1.0" filter="url(#shadow)"/><rect x="735" y="230" width="330" height="42" rx="21" fill="#EAF0FF" stroke="#EAF0FF" stroke-width="0" opacity="1.0"/><text x="900.0" y="258" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" fill="#3559E0" text-anchor="middle" opacity="1.0">Decimal degrees</text>
<text x="900" y="325" font-family="Inter,Arial,sans-serif" font-size="38" font-weight="800" fill="#3559E0" text-anchor="middle" opacity="1.0">38.4364</text>
<text x="900" y="380" font-family="Inter,Arial,sans-serif" font-size="38" font-weight="800" fill="#E07A2D" text-anchor="middle" opacity="1.0">−78.8675</text>
<text x="900" y="445" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="500" fill="#667085" text-anchor="middle">
  <tspan x="900" dy="0">Compact, numeric, and ready</tspan>
  <tspan x="900" dy="25">for mapping software</tspan>
</text>
<rect x="390" y="555" width="420" height="42" rx="21" fill="#F2ECFA" stroke="#F2ECFA" stroke-width="0" opacity="1.0"/><text x="600.0" y="583" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" fill="#7047B8" text-anchor="middle" opacity="1.0">decimal = degrees + minutes/60 + seconds/3600</text>
</svg>
