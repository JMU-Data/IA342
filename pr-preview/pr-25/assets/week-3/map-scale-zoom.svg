<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470">
  <rect width="1200" height="470" fill="#ffffff"/>
  <style>
    .t { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #1f2937; }
    .h { font-size: 30px; font-weight: 700; fill: #111827; }
    .l { font-size: 22px; font-weight: 700; fill: #1e293b; }
    .m { font-size: 17px; fill: #4b5563; }
    .sm { font-size: 15px; fill: #64748b; font-weight: 600; }
    .scale-tag { font-size: 13px; font-weight: 700; fill: #0969da; }
    .zoom-text { font-size: 14px; font-weight: 700; fill: #475569; letter-spacing: 0.5px; }
  </style>
  <text x="600" y="46" text-anchor="middle" class="t h">Zoom changes map scale</text>
  <defs>
    <marker id="zoom-arrow" markerWidth="10" markerHeight="10" refX="7" refY="3.5" orient="auto">
      <polygon points="0 0, 8 3.5, 0 7" fill="#475569"/>
    </marker>
    <clipPath id="clip-small"><rect x="75" y="80" width="280" height="185" rx="10"/></clipPath>
    <clipPath id="clip-med"><rect x="460" y="80" width="280" height="185" rx="10"/></clipPath>
    <clipPath id="clip-large"><rect x="845" y="80" width="280" height="185" rx="10"/></clipPath>
  </defs>

  <!-- PANEL 1: Small Scale -->
  <rect x="60" y="65" width="310" height="325" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <g clip-path="url(#clip-small)">
    <!-- Base region -->
    <rect x="75" y="80" width="280" height="185" fill="#f1f5f9"/>
    <!-- Regional mountain ridges & borders -->
    <path d="M75 140 Q130 120 180 150 T280 130 T355 160" fill="none" stroke="#cbd5e1" stroke-width="12"/>
    <path d="M75 180 Q140 160 210 190 T355 170" fill="none" stroke="#e2e8f0" stroke-width="18"/>
    <!-- State boundary line -->
    <path d="M120 80 L140 265" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6,4"/>
    <!-- Major Interstate -->
    <path d="M85 240 C140 200 180 180 230 130 S310 95 345 80" fill="none" stroke="#64748b" stroke-width="4"/>
    <!-- Broad River -->
    <path d="M90 90 Q160 110 200 160 T320 265" fill="none" stroke="#93c5fd" stroke-width="4"/>
    <!-- Regional target pin -->
    <circle cx="215" cy="165" r="14" fill="#fee2e2"/>
    <circle cx="215" cy="165" r="7" fill="#ef4444"/>
  </g>
  <rect x="75" y="80" width="280" height="185" rx="10" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="215" y="300" text-anchor="middle" class="t l">Small scale</text>
  <text x="215" y="328" text-anchor="middle" class="t sm">larger area • less detail</text>
  <text x="215" y="354" text-anchor="middle" class="t scale-tag">e.g. 1:500,000 (Valley/State)</text>

  <!-- ZOOM ARROW 1 -->
  <g transform="translate(385, 172)">
    <text x="27" y="-12" text-anchor="middle" class="t zoom-text">ZOOM IN</text>
    <line x1="5" y1="0" x2="50" y2="0" stroke="#475569" stroke-width="3.5" marker-end="url(#zoom-arrow)"/>
  </g>

  <!-- PANEL 2: Medium Scale -->
  <rect x="445" y="65" width="310" height="325" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <g clip-path="url(#clip-med)">
    <rect x="460" y="80" width="280" height="185" fill="#f8fafc"/>
    <!-- County & city urban area patch -->
    <ellipse cx="600" cy="172" rx="90" ry="60" fill="#fef3c7" opacity="0.8"/>
    <!-- River -->
    <path d="M460 110 Q520 130 550 170 T630 265" fill="none" stroke="#93c5fd" stroke-width="6"/>
    <!-- City Arterial Highway & Bypass -->
    <path d="M470 250 C520 200 560 180 620 140 S700 110 740 90" fill="none" stroke="#64748b" stroke-width="5"/>
    <ellipse cx="600" cy="172" rx="55" ry="40" fill="none" stroke="#cbd5e1" stroke-width="3"/>
    <!-- Main connector roads -->
    <line x1="490" y1="120" x2="710" y2="220" stroke="#cbd5e1" stroke-width="3"/>
    <line x1="520" y1="230" x2="680" y2="105" stroke="#cbd5e1" stroke-width="3"/>
    <!-- Target area indicator -->
    <circle cx="600" cy="172" r="16" fill="#fee2e2"/>
    <circle cx="600" cy="172" r="8" fill="#ef4444"/>
  </g>
  <rect x="460" y="80" width="280" height="185" rx="10" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="600" y="300" text-anchor="middle" class="t l">Medium scale</text>
  <text x="600" y="328" text-anchor="middle" class="t sm">smaller area • more detail</text>
  <text x="600" y="354" text-anchor="middle" class="t scale-tag">e.g. 1:50,000 (County/City)</text>

  <!-- ZOOM ARROW 2 -->
  <g transform="translate(770, 172)">
    <text x="27" y="-12" text-anchor="middle" class="t zoom-text">ZOOM IN</text>
    <line x1="5" y1="0" x2="50" y2="0" stroke="#475569" stroke-width="3.5" marker-end="url(#zoom-arrow)"/>
  </g>

  <!-- PANEL 3: Large Scale -->
  <rect x="830" y="65" width="310" height="325" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <g clip-path="url(#clip-large)">
    <rect x="845" y="80" width="280" height="185" fill="#f1f5f9"/>
    <!-- Green space / lawns -->
    <rect x="860" y="95" width="100" height="65" rx="4" fill="#dcfce7"/>
    <rect x="990" y="180" width="115" height="70" rx="4" fill="#dcfce7"/>
    <!-- Local street grid with sidewalks -->
    <rect x="845" y="165" width="280" height="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="965" y="80" width="20" height="185" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <!-- Building footprints -->
    <rect x="875" y="105" width="70" height="45" rx="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
    <rect x="1000" y="100" width="55" height="50" rx="4" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/>
    <rect x="1065" y="105" width="50" height="45" rx="4" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/>
    <rect x="870" y="195" width="80" height="55" rx="4" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/>
    <!-- Target site: pinpoint on building -->
    <circle cx="910" cy="127" r="14" fill="#fee2e2"/>
    <circle cx="910" cy="127" r="7" fill="#ef4444"/>
  </g>
  <rect x="845" y="80" width="280" height="185" rx="10" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="985" y="300" text-anchor="middle" class="t l">Large scale</text>
  <text x="985" y="328" text-anchor="middle" class="t sm">small area • high detail</text>
  <text x="985" y="354" text-anchor="middle" class="t scale-tag">e.g. 1:2,400 (Campus/Building)</text>

  <!-- BOTTOM TAKEAWAY -->
  <text x="600" y="435" text-anchor="middle" class="t m">Large scale means a larger representative fraction, not a larger geographic area.</text>
</svg>