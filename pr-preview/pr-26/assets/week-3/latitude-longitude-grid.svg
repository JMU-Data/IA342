<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Latitude and longitude grid</title>
<desc id="desc">Latitude and longitude grid</desc>
<defs>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#101828" flood-opacity="0.10"/></filter>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L12,6 L0,12 z" fill="#667085"/></marker>
  <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L12,6 L0,12 z" fill="#3559E0"/></marker>
</defs>
<rect width="1200" height="675" fill="#F7F8FA"/>
<text x="70" y="68" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="700" fill="#18212F" text-anchor="start" opacity="1.0">Latitude and longitude create a global address</text>
<text x="70" y="103" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="400" fill="#667085" text-anchor="start" opacity="1.0">Latitude measures north–south position; longitude measures east–west position.</text>
<circle cx="390" cy="360" r="205" fill="#FFFFFF" stroke="#3559E0" stroke-width="4" opacity="1.0"/><ellipse cx="390" cy="360" rx="202.0" ry="21.0" fill="none" stroke="#D9DEE7" stroke-width="2"/><ellipse cx="390" cy="325" rx="202.0" ry="18.5" fill="none" stroke="#D9DEE7" stroke-width="2"/><ellipse cx="390" cy="395" rx="202.0" ry="18.5" fill="none" stroke="#D9DEE7" stroke-width="2"/><ellipse cx="390" cy="360" rx="190.8" ry="16.5" fill="none" stroke="#D9DEE7" stroke-width="2"/><ellipse cx="390" cy="285" rx="190.8" ry="14.5" fill="none" stroke="#D9DEE7" stroke-width="2"/><ellipse cx="390" cy="435" rx="190.8" ry="14.5" fill="none" stroke="#D9DEE7" stroke-width="2"/><ellipse cx="390" cy="360" rx="166.2" ry="11.4" fill="none" stroke="#D9DEE7" stroke-width="2"/><ellipse cx="390" cy="240" rx="166.2" ry="10.0" fill="none" stroke="#D9DEE7" stroke-width="2"/><ellipse cx="390" cy="480" rx="166.2" ry="10.0" fill="none" stroke="#D9DEE7" stroke-width="2"/><ellipse cx="390" cy="360" rx="121.7" ry="8.0" fill="none" stroke="#D9DEE7" stroke-width="2"/><ellipse cx="390" cy="195" rx="121.7" ry="7.0" fill="none" stroke="#D9DEE7" stroke-width="2"/><ellipse cx="390" cy="525" rx="121.7" ry="7.0" fill="none" stroke="#D9DEE7" stroke-width="2"/><ellipse cx="390" cy="360" rx="205" ry="42" fill="none" stroke="#00A6A6" stroke-width="5"/><ellipse cx="390" cy="360" rx="55" ry="205" fill="none" stroke="#D9DEE7" stroke-width="2"/><ellipse cx="390" cy="360" rx="115" ry="205" fill="none" stroke="#D9DEE7" stroke-width="2"/><ellipse cx="390" cy="360" rx="165" ry="205" fill="none" stroke="#D9DEE7" stroke-width="2"/><line x1="390" y1="155" x2="390" y2="565" stroke="#E07A2D" stroke-width="5" opacity="1.0"/><text x="390" y="605" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" fill="#00A6A6" text-anchor="middle" opacity="1.0">Equator: 0° latitude</text>
<text x="390" y="136" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" fill="#E07A2D" text-anchor="middle" opacity="1.0">Prime meridian: 0° longitude</text>
<circle cx="325" cy="292" r="11" fill="#C2413B" stroke="none" stroke-width="0" opacity="1.0"/><line x1="325" y1="292" x2="675" y2="245" stroke="#C2413B" stroke-width="2" opacity="1.0" marker-end="url(#arrow)"/><rect x="700" y="190" width="410" height="250" rx="18" fill="#FFFFFF" stroke="#D9DEE7" stroke-width="2" opacity="1.0" filter="url(#shadow)"/><text x="730" y="240" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="700" fill="#18212F" text-anchor="start" opacity="1.0">James Madison University</text>
<text x="730" y="292" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="600" fill="#667085" text-anchor="start" opacity="1.0">Latitude</text>
<text x="1000" y="292" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="800" fill="#3559E0" text-anchor="end" opacity="1.0">≈ 38.44° N</text>
<text x="730" y="340" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="600" fill="#667085" text-anchor="start" opacity="1.0">Longitude</text>
<text x="1000" y="340" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="800" fill="#E07A2D" text-anchor="end" opacity="1.0">≈ 78.87° W</text>
<line x1="730" y1="365" x2="1080" y2="365" stroke="#D9DEE7" stroke-width="2" opacity="1.0"/><text x="730" y="398" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="500" fill="#18212F" text-anchor="start">
  <tspan x="730" dy="0">A coordinate locates a point,</tspan>
  <tspan x="730" dy="27">but it does not explain the pattern.</tspan>
</text>
</svg>
