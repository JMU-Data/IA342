<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-label="Part-to-whole: pie or ordered bars?"><title>Part-to-whole: pie or ordered bars?</title><rect width="1200" height="620" fill="white"/><g font-family="Arial, sans-serif" fill="#173442"><text x="36" y="44" font-size="27" fill="#173442" text-anchor="start" font-weight="700">Part-to-whole: pie or ordered bars?</text><text x="36" y="76" font-size="17" fill="#5E707A" text-anchor="start">Illustrative preferred service channels • 100 respondents chose one option</text><path d="M 305 333 L 305.0 148.0 A 185 185 0 0 1 413.74027167410753 482.66814395936524 Z" fill="#276B83" stroke="white" stroke-width="2"/><path d="M 305 333 L 413.74027167410753 482.66814395936524 A 185 185 0 0 1 129.0545444853966 390.1681439593653 Z" fill="#DD8751" stroke="white" stroke-width="2"/><path d="M 305 333 L 129.0545444853966 390.1681439593653 A 185 185 0 0 1 155.3318560406347 224.2597283258925 Z" fill="#659A82" stroke="white" stroke-width="2"/><path d="M 305 333 L 155.3318560406347 224.2597283258925 A 185 185 0 0 1 247.8318560406347 157.0545444853966 Z" fill="#9678A8" stroke="white" stroke-width="2"/><path d="M 305 333 L 247.8318560406347 157.0545444853966 A 185 185 0 0 1 304.99999999999994 148.0 Z" fill="#B7A34B" stroke="white" stroke-width="2"/><text x="660" y="198" font-size="21" fill="#173442" text-anchor="end">Website</text><rect x="685" y="175" width="360" height="33" rx="0" fill="#276B83"/><text x="1057" y="200" font-size="23" fill="#173442" text-anchor="start" font-weight="700">40%</text><text x="660" y="272" font-size="21" fill="#173442" text-anchor="end">Phone</text><rect x="685" y="249" width="270" height="33" rx="0" fill="#DD8751"/><text x="967" y="274" font-size="23" fill="#173442" text-anchor="start" font-weight="700">30%</text><text x="660" y="346" font-size="21" fill="#173442" text-anchor="end">In person</text><rect x="685" y="323" width="135" height="33" rx="0" fill="#659A82"/><text x="832" y="348" font-size="23" fill="#173442" text-anchor="start" font-weight="700">15%</text><text x="660" y="420" font-size="21" fill="#173442" text-anchor="end">Email</text><rect x="685" y="397" width="90" height="33" rx="0" fill="#9678A8"/><text x="787" y="422" font-size="23" fill="#173442" text-anchor="start" font-weight="700">10%</text><text x="660" y="494" font-size="21" fill="#173442" text-anchor="end">Other</text><rect x="685" y="471" width="45" height="33" rx="0" fill="#B7A34B"/><text x="742" y="496" font-size="23" fill="#173442" text-anchor="start" font-weight="700">5%</text><text x="36" y="598" font-size="17" fill="#5E707A" text-anchor="start">These options are mutually exclusive and sum to 100%. Bars make their ranking explicit.</text></g></svg>