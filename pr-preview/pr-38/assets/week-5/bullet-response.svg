<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-label="For response time, a smaller value is better"><title>For response time, a smaller value is better</title><rect width="1200" height="620" fill="white"/><g font-family="Arial, sans-serif" fill="#173442"><text x="36" y="44" font-size="27" fill="#173442" text-anchor="start" font-weight="700">For response time, a smaller value is better</text><text x="36" y="76" font-size="17" fill="#5E707A" text-anchor="start">Illustrative service dashboard • minutes; target ≤ 10</text><text x="65" y="240" font-size="24" fill="#173442" text-anchor="start" font-weight="700">Team A</text><rect x="260" y="205" width="370" height="70" rx="0" fill="#E2EFE9"/><rect x="630" y="205" width="185" height="70" rx="0" fill="#F3EBD4"/><rect x="815" y="205" width="185" height="70" rx="0" fill="#F0D9CE"/><rect x="260" y="226" width="296" height="28" rx="0" fill="#276B83"/><line x1="630" y1="192" x2="630" y2="288" stroke="#173442" stroke-width="5"/><text x="566" y="247" font-size="22" fill="#173442" text-anchor="start" font-weight="700">8 min</text><text x="260" y="316" font-size="18" fill="#173442" text-anchor="middle">0</text><text x="445" y="316" font-size="18" fill="#173442" text-anchor="middle">5</text><text x="630" y="316" font-size="18" fill="#173442" text-anchor="middle">10</text><text x="815" y="316" font-size="18" fill="#173442" text-anchor="middle">15</text><text x="1000" y="316" font-size="18" fill="#173442" text-anchor="middle">20</text><text x="65" y="420" font-size="24" fill="#173442" text-anchor="start" font-weight="700">Team B</text><rect x="260" y="385" width="370" height="70" rx="0" fill="#E2EFE9"/><rect x="630" y="385" width="185" height="70" rx="0" fill="#F3EBD4"/><rect x="815" y="385" width="185" height="70" rx="0" fill="#F0D9CE"/><rect x="260" y="406" width="481" height="28" rx="0" fill="#DD8751"/><line x1="630" y1="372" x2="630" y2="468" stroke="#173442" stroke-width="5"/><text x="751" y="427" font-size="22" fill="#173442" text-anchor="start" font-weight="700">13 min</text><text x="260" y="496" font-size="18" fill="#173442" text-anchor="middle">0</text><text x="445" y="496" font-size="18" fill="#173442" text-anchor="middle">5</text><text x="630" y="496" font-size="18" fill="#173442" text-anchor="middle">10</text><text x="815" y="496" font-size="18" fill="#173442" text-anchor="middle">15</text><text x="1000" y="496" font-size="18" fill="#173442" text-anchor="middle">20</text><text x="650" y="150" font-size="22" fill="#173442" text-anchor="start" font-weight="700">Target ≤ 10</text><text x="36" y="598" font-size="17" fill="#5E707A" text-anchor="start">Background ranges must match the measure. High is not automatically good.</text></g></svg>