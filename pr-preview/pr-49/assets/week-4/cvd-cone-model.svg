<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Cone responses and color vision deficiency types</title>
  <desc id="desc">A schematic visible spectrum with overlapping S, M, and L cone response curves, followed by diagrams comparing typical trichromatic vision, dichromacy with one cone class absent, and anomalous trichromacy with one cone response altered.</desc>
  <defs>
    <linearGradient id="spectrum" x1="0" x2="1">
      <stop offset="0" stop-color="#6f2dbd"/><stop offset="0.16" stop-color="#3155d9"/>
      <stop offset="0.33" stop-color="#17a2b8"/><stop offset="0.49" stop-color="#39b54a"/>
      <stop offset="0.65" stop-color="#f1d302"/><stop offset="0.82" stop-color="#f28e2b"/>
      <stop offset="1" stop-color="#d62828"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="680" fill="#ffffff"/>
  <text x="600" y="52" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#1f2937">Cone responses overlap across the visible spectrum</text>
  <text x="600" y="87" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#4b5563">S, M, and L are response classes—not three isolated “blue / green / red sensors.”</text>

  <rect x="120" y="130" width="960" height="32" rx="8" fill="url(#spectrum)"/>
  <g font-family="Arial, sans-serif" font-size="16" fill="#374151">
    <text x="120" y="187">~400 nm</text><text x="1040" y="187">~700 nm</text>
  </g>
  <line x1="120" y1="204" x2="1080" y2="204" stroke="#9ca3af" stroke-width="2"/>

  <!-- stylized overlapping response curves -->
  <path d="M165 355 C210 350, 220 236, 320 221 C410 210, 430 320, 455 355" fill="none" stroke="#3b82f6" stroke-width="10" stroke-linecap="round"/>
  <path d="M330 355 C390 350, 430 215, 570 203 C710 191, 760 325, 790 355" fill="none" stroke="#22c55e" stroke-width="10" stroke-linecap="round"/>
  <path d="M545 355 C620 350, 675 230, 820 216 C960 202, 1010 325, 1040 355" fill="none" stroke="#ef4444" stroke-width="10" stroke-linecap="round"/>
  <g font-family="Arial, sans-serif" font-size="26" font-weight="700">
    <text x="298" y="248" fill="#2563eb">S</text>
    <text x="575" y="225" fill="#16a34a">M</text>
    <text x="850" y="240" fill="#dc2626">L</text>
  </g>
  <text x="600" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#6b7280">Schematic only: curve positions and heights are simplified for teaching.</text>

  <!-- cards -->
  <g font-family="Arial, sans-serif">
    <rect x="65" y="430" width="330" height="195" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <text x="230" y="470" text-anchor="middle" font-size="25" font-weight="700" fill="#111827">Typical trichromacy</text>
    <circle cx="155" cy="525" r="34" fill="#3b82f6" opacity=".88"/><circle cx="230" cy="525" r="34" fill="#22c55e" opacity=".88"/><circle cx="305" cy="525" r="34" fill="#ef4444" opacity=".88"/>
    <text x="155" y="533" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">S</text><text x="230" y="533" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">M</text><text x="305" y="533" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">L</text>
    <text x="230" y="592" text-anchor="middle" font-size="17" fill="#4b5563">Three functioning cone classes</text>

    <rect x="435" y="430" width="330" height="195" rx="18" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
    <text x="600" y="470" text-anchor="middle" font-size="25" font-weight="700" fill="#111827">Dichromacy</text>
    <circle cx="525" cy="525" r="34" fill="#3b82f6" opacity=".88"/><circle cx="600" cy="525" r="34" fill="#22c55e" opacity=".88"/><circle cx="675" cy="525" r="34" fill="#e5e7eb" stroke="#9ca3af" stroke-dasharray="7 6" stroke-width="3"/>
    <text x="525" y="533" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">S</text><text x="600" y="533" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">M</text><text x="675" y="533" text-anchor="middle" font-size="20" font-weight="700" fill="#6b7280">L</text>
    <text x="600" y="584" text-anchor="middle" font-size="17" fill="#4b5563">One cone class absent</text>
    <text x="600" y="607" text-anchor="middle" font-size="15" fill="#6b7280">e.g., protanopia / deuteranopia / tritanopia</text>

    <rect x="805" y="430" width="330" height="195" rx="18" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
    <text x="970" y="470" text-anchor="middle" font-size="25" font-weight="700" fill="#111827">Anomalous trichromacy</text>
    <circle cx="895" cy="525" r="34" fill="#3b82f6" opacity=".88"/><circle cx="970" cy="525" r="34" fill="#22c55e" opacity=".38" stroke="#16a34a" stroke-width="3"/><circle cx="1045" cy="525" r="34" fill="#ef4444" opacity=".88"/>
    <text x="895" y="533" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">S</text><text x="970" y="533" text-anchor="middle" font-size="20" font-weight="700" fill="#166534">M</text><text x="1045" y="533" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">L</text>
    <text x="970" y="584" text-anchor="middle" font-size="17" fill="#4b5563">All three present; one response altered</text>
    <text x="970" y="607" text-anchor="middle" font-size="15" fill="#6b7280">e.g., protanomaly / deuteranomaly / tritanomaly</text>
  </g>
</svg>
