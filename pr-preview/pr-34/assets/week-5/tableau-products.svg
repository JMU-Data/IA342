<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-label="Choose the right Tableau environment"><title>Choose the right Tableau environment</title><rect width="1200" height="560" fill="white"/><g font-family="Arial, sans-serif" fill="#173442"><text x="36" y="44" font-size="27" fill="#173442" text-anchor="start" font-weight="700">Choose the right Tableau environment</text><text x="36" y="76" font-size="17" fill="#5E707A" text-anchor="start">Conceptual product comparison • checked September 15, 2026</text><rect x="35" y="150" width="365" height="310" rx="12" fill="#F2F6F7" stroke="#DBE4E8"/><text x="217" y="209" font-size="28" fill="#173442" text-anchor="middle" font-weight="700">Tableau Cloud</text><text x="217" y="280" font-size="19" fill="#173442" text-anchor="middle">Hosted course site</text><text x="217" y="334" font-size="19" fill="#173442" text-anchor="middle">Browser authoring</text><text x="217" y="388" font-size="19" fill="#173442" text-anchor="middle">Share within the site</text><rect x="432" y="150" width="365" height="310" rx="12" fill="#F2F6F7" stroke="#DBE4E8"/><text x="614" y="209" font-size="28" fill="#173442" text-anchor="middle" font-weight="700">Tableau Desktop</text><text x="614" y="280" font-size="19" fill="#173442" text-anchor="middle">Installed authoring app</text><text x="614" y="334" font-size="19" fill="#173442" text-anchor="middle">Local data exploration</text><text x="614" y="388" font-size="19" fill="#173442" text-anchor="middle">Publishing depends on edition</text><rect x="829" y="150" width="365" height="310" rx="12" fill="#F2F6F7" stroke="#DBE4E8"/><text x="1011" y="209" font-size="28" fill="#173442" text-anchor="middle" font-weight="700">Tableau Public</text><text x="1011" y="280" font-size="19" fill="#173442" text-anchor="middle">Free public platform</text><text x="1011" y="334" font-size="19" fill="#173442" text-anchor="middle">Public portfolio and learning</text><text x="1011" y="388" font-size="19" fill="#173442" text-anchor="middle">Not the course submission site</text><text x="36" y="538" font-size="17" fill="#5E707A" text-anchor="start">Tableau Online is now Tableau Cloud. Public is available to everyone, not only students.</text></g></svg>