<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 530" role="img" aria-labelledby="t"><title id="t">How often recommendations are shared online</title><rect width="100%" height="100%" fill="white"/><g font-family="system-ui,Arial,sans-serif" fill="#203440"><text x="35" y="42" font-size="25" fill="#203440" >How often recommendations are shared online</text><line x1="260.0" y1="80" x2="260.0" y2="450" stroke="#e0e7eb"/><text x="260.0" y="480" font-size="17" fill="#597080" text-anchor="middle">0</text><line x1="386.0" y1="80" x2="386.0" y2="450" stroke="#e0e7eb"/><text x="386.0" y="480" font-size="17" fill="#597080" text-anchor="middle">10</text><line x1="512.0" y1="80" x2="512.0" y2="450" stroke="#e0e7eb"/><text x="512.0" y="480" font-size="17" fill="#597080" text-anchor="middle">20</text><line x1="638.0" y1="80" x2="638.0" y2="450" stroke="#e0e7eb"/><text x="638.0" y="480" font-size="17" fill="#597080" text-anchor="middle">30</text><line x1="764.0" y1="80" x2="764.0" y2="450" stroke="#e0e7eb"/><text x="764.0" y="480" font-size="17" fill="#597080" text-anchor="middle">40</text><line x1="890.0" y1="80" x2="890.0" y2="450" stroke="#e0e7eb"/><text x="890.0" y="480" font-size="17" fill="#597080" text-anchor="middle">50</text><text x="235" y="127" font-size="20" fill="#203440" text-anchor="end">Every few months</text><rect x="260" y="103" width="529.2" height="32" fill="#175d7b"/><text x="798.2" y="126" font-size="20" fill="#203440" >42%</text><text x="235" y="202" font-size="20" fill="#203440" text-anchor="end">Never</text><rect x="260" y="178" width="365.4" height="32" fill="#175d7b"/><text x="634.4" y="201" font-size="20" fill="#203440" >29%</text><text x="235" y="277" font-size="20" fill="#203440" text-anchor="end">Every few weeks</text><rect x="260" y="253" width="239.4" height="32" fill="#175d7b"/><text x="508.4" y="276" font-size="20" fill="#203440" >19%</text><text x="235" y="352" font-size="20" fill="#203440" text-anchor="end">Every few days</text><rect x="260" y="328" width="100.8" height="32" fill="#175d7b"/><text x="369.8" y="351" font-size="20" fill="#203440" >8%</text><text x="235" y="427" font-size="20" fill="#203440" text-anchor="end">Daily</text><rect x="260" y="403" width="25.2" height="32" fill="#175d7b"/><text x="294.2" y="426" font-size="20" fill="#203440" >2%</text><text x="35" y="515" font-size="14" fill="#597080" >Values transcribed from the published graphic. Underlying survey not independently verified.</text></g></svg>