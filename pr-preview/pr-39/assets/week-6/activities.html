<!DOCTYPE html>

<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><title>IA342 data-cleaning examples</title><style>
:root{--ink:#19384a;--muted:#526b78;--blue:#17688f;--pale:#edf5f8;--line:#cfdee5;--warm:#fff1d6;--green:#e5f3ea}*{box-sizing:border-box}body{margin:0;font:20px/1.32 system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--ink);background:white}main{padding:4px 2px}.tools{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:14px}button,select{font:600 18px/1.2 system-ui;padding:9px 14px;border:1px solid #aac3d0;background:white;color:var(--ink);border-radius:4px;cursor:pointer}button[aria-pressed=true],button.selected{background:var(--blue);color:white}button:focus-visible,select:focus-visible{outline:3px solid #ad6826;outline-offset:2px}button:disabled{opacity:.45;cursor:default}.grid{display:grid;grid-template-columns:1fr 1fr;gap:26px}.grid.wide{grid-template-columns:1.35fr 1fr}h3{font-size:21px;margin:0 0 10px}p{margin:9px 0}.note{padding:10px 14px;background:var(--pale);margin-top:12px;font-size:19px;line-height:1.3}.muted{color:var(--muted);font-size:17px}table{width:100%;border-collapse:collapse;font-size:19px;line-height:1.2}th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}th{background:var(--pale);font-weight:650}.small th,.small td{padding:5px 9px;font-size:18px}.dim{background:#e4f0f8!important}.meas{background:var(--green)!important}.hit td,.hit{background:var(--warm)!important}.bad{background:#fce8e4;color:#8c3023}.quiet{opacity:.35}.numbers{text-align:right;font-variant-numeric:tabular-nums}.barrow{display:grid;grid-template-columns:145px 1fr 75px;gap:10px;align-items:center;margin:15px 0;font-size:19px}.track{height:26px;background:#f3f6f7}.bar{height:100%;background:var(--blue);transition:width .2s}.axis{display:flex;justify-content:space-between;margin-left:155px;margin-right:85px;border-top:1px solid #809aa7;padding-top:4px;font-size:15px;color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{border:1px solid var(--line);padding:13px}.stat strong{display:block;font-size:32px;margin:6px 0}.label{font-size:16px;color:var(--muted)}.arrow{font-size:36px;color:var(--blue);text-align:center}.stepgrid{display:grid;grid-template-columns:1fr 50px 1fr 50px 1fr;align-items:center;gap:10px}.cell{border:1px solid var(--line);padding:14px;min-height:150px}.cell strong{font-size:30px;display:block;margin:12px 0}.legend{display:flex;gap:16px;font-size:16px;margin:8px 0}.swatch{display:inline-block;width:16px;height:16px;vertical-align:-2px;margin-right:5px}code{font:18px ui-monospace,Consolas,monospace}svg{width:100%;height:260px}.badge{display:inline-block;border:1px solid #b5cbd6;padding:3px 7px;font-size:16px;border-radius:3px}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
.bank-grid{display:grid;grid-template-columns:310px 110px 1fr;gap:18px;align-items:center}.people{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;margin:20px 8px 25px}.person{width:30px;height:43px;position:relative;display:block;border-radius:15px 15px 5px 5px;background:#d8e8f1;margin-top:13px}.person:before{content:'';position:absolute;width:22px;height:22px;border-radius:50%;left:4px;top:-14px;background:#17688f}.connector{text-align:center;font-size:46px;color:#17688f}.connector small{display:block;font-size:17px}.db-tags{display:flex;gap:8px;margin:16px 0 10px}.db-tags span{padding:6px 9px;background:#edf5f8;border:1px solid #bdced8;font-size:17px}.connection-grid{display:grid;align-items:center;gap:18px}.live-grid{grid-template-columns:1fr 180px 1fr}.extract-grid{grid-template-columns:1fr 95px 1fr 95px 1fr;gap:10px}.connection-node{border:1px solid #bed0db;min-height:200px;padding:15px 22px;text-align:center;background:#f8fbfc}.connection-node strong{font-size:53px;line-height:1.2;display:block;margin:13px 0}.connection-node small{display:block;font-size:16px;color:#526b78}.database-node{border-top:5px solid #17688f}.hyper-node{border-top:5px solid #327c6c;background:#f0f8f4}.dashboard-node{border-top:5px solid #ac682b}.query-arrow{text-align:center;color:#17688f}.query-arrow span,.query-arrow b{display:block;font-size:24px;margin:9px 0}.query-arrow small{font-size:16px;display:block;line-height:1.4}.dashboard-bar{height:17px;background:#e5ecef;margin:12px 0 6px;text-align:left}.dashboard-bar i{display:block;height:100%;background:#17688f}.reuse-grid{display:grid;grid-template-columns:1fr 235px 1fr;gap:20px;align-items:start}.saved-flow{border:2px solid #17688f;background:#f1f7fa;text-align:center;padding:16px 10px}.saved-flow p{font-size:19px;margin:14px 0}.saved-flow strong{font-size:30px}.not-run{height:151px;display:grid;place-items:center;text-align:center;border:1px dashed #9ab5c5;font-size:20px;color:#526b78}
main > :last-child{margin-bottom:0}.connection-node p{margin:6px 0}.bank-users .people{margin-top:17px;margin-bottom:19px}.excel-file-label{padding:7px 11px;background:#eef5f8;font-size:18px;font-weight:650;border:1px solid #cfdee5;border-bottom:0}
</style></head><body><main id="app"></main><script>
'use strict';
const root=document.getElementById('app');
const sales=[
['2/1/12','23094A','Byers, Alotta',1,'Shoes','NIKE1','Nike','Runners',101,'Pay, Freda',79.95,1],
['2/1/12','23094A','Byers, Alotta',1,'Socks','FOL3','Fruit of the Loom','Kneehighs',101,'Pay, Freda',10.98,3],
['2/1/12','34234B','Franks, George',2,'Belts','BELT1','Housebrand','41-inch Belt',101,'Pay, Freda',16.95,1],
['2/1/12','23327Q','Smith, Jon',3,'Shoes','ADID8','Adidas','Supersport',101,'Pay, Freda',68.99,1],
['2/2/12','34634A','Fields, Mary',4,'Socks','FOL3','Fruit of the Loom','Anglehighs',102,'Merkle, Fred',6.98,3],
['2/3/12','34634A','Fields, Mary',4,'Sandals','KEEN7','Keen','Desert Walker',102,'Merkle, Fred',82.98,1],
['2/3/12','34634A','Fields, Mary',4,'Sandals','KEEN8','Keen','Night Runner',102,'Merkle, Fred',69.98,2],
['2/3/12','67657T','Geld, Reginald',5,'Ties','TIE8','Housebrand','Yellow Polkadot',101,'Pay, Freda',22.79,1],
['2/3/12','34543A','Turner, Rod',6,'Socks','CHMP3','Champion','Athletic Sport',101,'Pay, Freda',7.98,4]];
const money=n=>Number(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=x=>String(x??'null').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
function table(headers,rows,cl=''){return '<table class="'+cl+'"><thead><tr>'+headers.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(x=>'<td>'+x+'</td>').join('')+'</tr>').join('')+'</tbody></table>'}
function buttons(opts,selected){return '<div class="tools">'+opts.map(([k,v])=>'<button data-key="'+k+'" aria-pressed="'+(k===selected)+'">'+v+'</button>').join('')+'</div>'}
function bind(fn){root.querySelectorAll('button[data-key]').forEach(b=>b.onclick=()=>fn(b.dataset.key))}
function bars(items,max,fmt=x=>String(x)){return items.map(([label,n])=>'<div class="barrow"><span>'+esc(label)+'</span><div class="track"><div class="bar" style="width:'+100*n/max+'%"></div></div><span class="numbers">'+fmt(n)+'</span></div>').join('')+'<div class="axis"><span>0</span><span>'+fmt(max)+'</span></div>'}
function oltp(state='before'){
 const after=state==='after';
 root.innerHTML=buttons([['before','Before purchase'],['after','Record one purchase']],state)+'<div class="stepgrid"><div class="cell"><span class="badge">Sales table</span><p>New sale O104</p><strong>'+(after?'Recorded':'Not yet')+'</strong><p class="muted">C101 · NIKE1 · quantity 1</p></div><div class="arrow">→</div><div class="cell"><span class="badge">Inventory table</span><p>NIKE1 in stock</p><strong>'+(after?'9 pairs':'10 pairs')+'</strong><p class="muted">One pair leaves inventory.</p></div><div class="arrow">→</div><div class="cell"><span class="badge">Payment table</span><p>Payment for O104</p><strong>'+(after?'$79.95':'Not recorded')+'</strong><p class="muted">The same purchase is linked.</p></div></div><p class="note">'+(after?'These related updates belong to one transaction. If the transaction fails, the system must not leave only some of these changes committed.':'OLTP handles a small operational task accurately while other customers make purchases.')+'</p>';bind(oltp)
}
const warehouse=[{month:'Jan',channel:'Store',sales:1200,returns:100},{month:'Jan',channel:'Online',sales:800,returns:50},{month:'Feb',channel:'Store',sales:1500,returns:200},{month:'Feb',channel:'Online',sales:1000,returns:100}];
function olap(group='Month',channel='All'){
 let data=warehouse.filter(r=>channel==='All'||r.channel===channel);const agg={};for(const r of data){const k=group==='Month'?r.month:r.channel;agg[k]=(agg[k]||0)+r.sales-r.returns}const entries=Object.entries(agg);
 root.innerHTML='<div class="tools"><label>Group by <select id="group"><option>Month</option><option>Channel</option></select></label><label>Channel filter <select id="channel"><option>All</option><option>Store</option><option>Online</option></select></label></div><div class="grid"><div><h3>Prepared monthly data</h3>'+table(['Month','Channel','Sales','Returns'],data.map(r=>[r.month,r.channel,r.sales,r.returns]))+'</div><div><h3>Net sales = Sales − Returns ($)</h3>'+bars(entries,2500)+'</div></div><p class="note">'+(group==='Month'&&channel==='All'?'Jan: 1,200 + 800 − 100 − 50 = <b>$1,850</b>. Feb: <b>$2,200</b>.':'The query changes the grouping or filter—not the stored sales records.')+'</p>';
 root.querySelector('#group').value=group;root.querySelector('#channel').value=channel;root.querySelector('#group').onchange=e=>olap(e.target.value,channel);root.querySelector('#channel').onchange=e=>olap(group,e.target.value)
}
function labels(state='raw'){
 const clean=state==='clean';const data=clean?[['Cincinnati',12]]:[['Cinainnati',4],['Cincinnati',5],['Cincinnatti',3]];
 root.innerHTML=buttons([['raw','Original labels'],['clean','Standardize city and state']],state)+'<div class="grid"><div><h3>Three source systems</h3>'+table(['Source','City','State','Records'],[['1',clean?'Cincinnati':'Cinainnati',clean?'OH':'Ohio',4],['2','Cincinnati','OH',5],['3',clean?'Cincinnati':'Cincinnatti',clean?'OH':'O',3]])+'</div><div><h3>Number of records grouped by City</h3>'+bars(data,12)+'</div></div><p class="note">'+(clean?'The same 12 records now form one city group. No customer was added or removed.':'Spelling variants split one city into three chart categories. A neat chart can still give a misleading picture.')+'</p>';bind(labels)
}
function averages(state='raw'){
 const raw=state==='raw',zero=state==='zero';const vals=raw?[100,200,200,null]:[100,200,zero?0:null];const valid=vals.filter(x=>x!==null);const avg=valid.reduce((a,b)=>a+b,0)/valid.length;
 const rows=raw?[['A',100,'Original sale'],['B',200,'Original sale'],['B',200,'Confirmed copy'],['C','null','Price unknown']]:[['A',100,'Original sale'],['B',200,'Original sale'],['C',zero?0:'null',zero?'Unknown changed to zero':'Price unknown']];
 root.innerHTML=buttons([['raw','Keep the duplicate'],['dedup','Remove only the copy'],['zero','Then fill missing with zero']],state)+'<div class="grid"><div>'+table(['Sale ID','Price','Meaning'],rows)+'</div><div><p class="label">Average of non-null values</p><p style="font-size:48px;margin:10px 0">'+money(avg)+'</p><p>('+valid.join(' + ')+') ÷ '+valid.length+'</p><p class="note">'+(raw?'B is counted twice.':zero?'A missing price is not evidence that the item was free.':'Keep C as unknown; do not invent its price.')+'</p></div></div>';bind(averages)
}
function copypaste(state='original'){
 const bad=state==='error';const rows=sales.slice(0,4).map((r,i)=>[r[0],r[1],r[4],i===2&&bad?'<span class="bad">68.99</span>':money(r[10]),r[11]]);
 root.innerHTML=buttons([['original','Before the paste'],['error','Paste into the wrong row']],state)+'<div class="excel-file-label">Sales.xlsx · Sales worksheet</div>'+table(['Date','CustomerID','Category','Price','Quantity'],rows)+'<p class="note">'+(bad?'In Excel, the paste overwrites the belt’s price with the shoes’ price. Both are valid numbers: a number format alone cannot detect the error.':'In Sales.xlsx, the belt’s price is 16.95 and the shoes’ price below it is 68.99. A misplaced paste changes the stored value.')+'</p>';bind(copypaste)
}
function roles(state='none'){
 const inds=[0,1,3,4,9,10,11],heads=['Date','CustomerID','OrderID','Category','AgentName','Price','Quantity'];
 root.innerHTML=buttons([['none','Inspect the fields'],['dims','Highlight dimensions'],['measures','Highlight measures']],state)+table(heads,sales.map(r=>inds.map(i=>i===10?money(r[i]):r[i])),'small')+'<p class="note">'+(state==='dims'?'Dates, customer/order IDs, category and agent identify or group records. An ID can contain numbers without being an amount.':state==='measures'?'Price and Quantity are measures. The aggregation still matters: summing unit prices is not the same as calculating sales revenue.':'Which fields describe the sale? Which fields provide an amount or quantity?')+'</p>';
 if(state!=='none')root.querySelectorAll('tr').forEach(tr=>[...tr.cells].forEach((c,i)=>{if((state==='dims'&&i<5)||(state==='measures'&&i>=5))c.classList.add(state==='dims'?'dim':'meas')}));bind(roles)
}
function roleviz(group='Category',metric='SUM(Quantity)'){
 const index=group==='Category'?4:9, m={}; for(const r of sales){(m[r[index]]??=[]).push(r)}
 let entries=Object.entries(m).map(([k,rs])=>[k, metric==='SUM(Quantity)'?rs.reduce((s,r)=>s+r[11],0):metric==='AVG(Price)'?rs.reduce((s,r)=>s+r[10],0)/rs.length:rs.reduce((s,r)=>s+r[10]*r[11],0)]);entries.sort((a,b)=>b[1]-a[1]);let max=metric==='SUM(Quantity)'?15:metric==='AVG(Price)'?100:300;
 const fmt=metric==='SUM(Quantity)'?x=>String(x):money;
 root.innerHTML='<div class="tools"><label>Dimension <select id="dim"><option>Category</option><option>AgentName</option></select></label><label>Measure <select id="metric"><option>SUM(Quantity)</option><option>AVG(Price)</option><option>SUM(Sales)</option></select></label></div><div class="grid"><div><h3>Summary of the same nine rows</h3>'+table([group,metric],entries.map(([k,n])=>[k,fmt(n)]),'small')+'<p class="muted">Sales = Price × Quantity.</p></div><div><h3>'+esc(metric)+' by '+esc(group)+'</h3>'+bars(entries,max,fmt)+'</div></div><p class="note">The dimension defines the groups. The measure and aggregation define what each bar means.</p>';
 root.querySelector('#dim').value=group;root.querySelector('#metric').value=metric;root.querySelector('#dim').onchange=e=>roleviz(e.target.value,metric);root.querySelector('#metric').onchange=e=>roleviz(group,e.target.value)
}
function join(kind='left'){
 const A=[['O1',80],['O2',30],['O3',20]],B=[['O2','Yes'],['O4','Yes']];let rows=[];for(const a of A){const b=B.find(b=>b[0]===a[0]);if(b||kind==='left'||kind==='full')rows.push([a[0],a[1],b?b[0]:'null',b?b[1]:'null'])}if(kind==='right'||kind==='full')for(const b of B)if(!A.some(a=>a[0]===b[0]))rows.push(['null','null',b[0],b[1]]);
 root.innerHTML=buttons([['inner','Inner'],['left','Left'],['right','Right'],['full','Full outer']],kind)+'<div class="grid"><div><h3>Orders (left) + Returns (right)</h3><div class="grid" style="gap:12px">'+table(['Order ID','Sales'],A,'small')+table(['Order ID','Returned'],B,'small')+'</div><p class="muted">Match: Orders.Order ID = Returns.Order ID.</p></div><div><h3>'+kind[0].toUpperCase()+kind.slice(1)+' join · '+rows.length+' result rows</h3>'+table(['Order ID (L)','Sales','Order ID (R)','Returned'],rows,'small')+'</div></div><p class="note">'+({inner:'Keep only matching keys: O2.',left:'Keep every Orders row. O1 and O3 have no matching return record.',right:'Keep every Returns row, including O4 with no matching order.',full:'Keep matches and unmatched rows from both tables. Nulls expose missing matches.'}[kind])+'</p>';bind(join)
}
// Synthetic classroom examples only. No network, storage or database writes.
let bankState={a:1000,b:500,reads:0,writes:0,msg:'Choose a short read or write request. These balances are invented.'};
function bank(action='reset'){
 if(action==='reset')bankState={a:1000,b:500,reads:0,writes:0,msg:'Choose a short read or write request. These balances are invented.'};
 if(action==='read'){bankState.reads++;bankState.msg='READ: return account A’s current balance. Other customers can submit their own requests.';}
 if(action==='deposit'){bankState.a+=100;bankState.writes++;bankState.msg='WRITE: deposit $100 into A and record the transaction in the ledger.';}
 if(action==='transfer'){bankState.a-=50;bankState.b+=50;bankState.writes++;bankState.msg='COMMIT: debit A by $50 and credit B by $50 together. The combined balance does not change.';}
 root.innerHTML='<div class="bank-grid"><div class="bank-users"><h3>Many customers at once</h3><div class="people" aria-label="Twelve customer icons">'+Array.from({length:12},()=>'<span class="person"></span>').join('')+'</div><p><b>Mobile app · ATM · teller</b></p><p class="muted">Short requests for specific accounts</p></div><div class="connector">⇄<small>read / write</small></div><div><h3>Operational relational database</h3>'+table(['Account · PK','Current balance'],[['A','$'+money(bankState.a)],['B','$'+money(bankState.b)]])+'<div class="db-tags"><span>Customers</span><span>Accounts</span><span>Transaction ledger</span></div><p class="muted">Keys link accounts and transaction records.</p></div></div><div class="tools" style="margin-top:22px"><button data-key="read">Check A’s balance</button><button data-key="deposit">Deposit $100 to A</button><button data-key="transfer">Transfer $50: A → B</button><button data-key="reset">Reset</button></div><p class="note" role="status">'+bankState.msg+'</p>';bind(bank);
}
function deletion(action='start'){
 const removed=action==='file';
 root.innerHTML='<div class="tools"><button data-key="file">Delete C101 in Excel</button><button data-key="database">Try DELETE with a foreign key</button><button data-key="start">Reset</button></div><div class="grid"><div><h3>Customers.xlsx · Customer records</h3>'+table(['CustomerID','Name'],removed?[['C205','Customer B']]:[['C101','Customer A'],['C205','Customer B']])+'</div><div><h3>Orders.xlsx · Order records</h3>'+table(['OrderID','CustomerID','Amount'],[['O101','<b>C101</b>','$80'],['O102','C205','$30']])+'</div></div><p class="note" role="status">'+(removed?'<b>Excel result:</b> the customer row is deleted, but Orders.xlsx still contains C101. The two files do not enforce a foreign-key constraint.':action==='database'?'<b>Database result: DELETE rejected.</b> These same tables, stored in a database with an enforced ON DELETE RESTRICT foreign key, protect the referenced customer.':'Order O101 refers to customer C101. Deleting that customer changes the meaning of the remaining order.')+'</p>';bind(deletion);
}
let liveDemo={source:100,view:100};
function liveQuery(action='reset'){
 if(action==='reset')liveDemo={source:100,view:100};
 if(action==='change')liveDemo.source=150;
 if(action==='query')liveDemo.view=liveDemo.source;
 root.innerHTML='<div class="connection-grid live-grid"><div class="connection-node database-node"><span class="badge">Original database</span><p>Recorded deposits</p><strong>$'+liveDemo.source+'</strong><small>Committed source total</small></div><div class="query-arrow"><span>← query</span><b>→ results</b><small>No extract copy</small></div><div class="connection-node dashboard-node"><span class="badge">Tableau dashboard</span><p>Latest displayed result</p><strong>$'+liveDemo.view+'</strong><div class="dashboard-bar"><i style="width:'+liveDemo.view/2+'%"></i></div><small>Fixed scale: $0–$200</small></div></div><div class="tools" style="margin-top:18px"><button data-key="change">1. Update database to $150</button><button data-key="query">2. Query / refresh dashboard</button><button data-key="reset">Reset</button></div><p class="note" role="status">'+(liveDemo.source===liveDemo.view?'The dashboard has queried the original database. Its result matches the source at this query.':'The database changed. The open dashboard still shows its previous result until it issues a new query.')+'</p>';bind(liveQuery);
}
let extractDemo={source:100,copy:100,view:100,refreshed:false};
function extractQuery(action='reset'){
 if(action==='reset')extractDemo={source:100,copy:100,view:100,refreshed:false};
 if(action==='change')extractDemo.source=150;
 if(action==='refresh'){extractDemo.copy=extractDemo.source;extractDemo.refreshed=true;}
 if(action==='query')extractDemo.view=extractDemo.copy;
 root.innerHTML='<div class="connection-grid extract-grid"><div class="connection-node database-node"><span class="badge">Original database</span><strong>$'+extractDemo.source+'</strong><small>Current source total</small></div><div class="query-arrow"><b>→</b><small>Create / refresh<br>the copy</small></div><div class="connection-node hyper-node"><span class="badge">deposits.hyper</span><strong>$'+extractDemo.copy+'</strong><small>Separate optimized extract</small></div><div class="query-arrow"><span>← query</span><b>→ results</b></div><div class="connection-node dashboard-node"><span class="badge">Dashboard</span><strong>$'+extractDemo.view+'</strong><small>Reads the extract</small></div></div><div class="tools" style="margin-top:18px"><button data-key="change">Update database to $150</button><button data-key="query">Query dashboard</button><button data-key="refresh">Refresh extract</button><button data-key="reset">Reset</button></div><p class="note" role="status">'+(extractDemo.source!==extractDemo.copy?'Source is $150, but the extract is still $100. Querying the dashboard does not fetch the new source rows.':extractDemo.copy!==extractDemo.view?'The extract now contains $150. Query the dashboard again to display the refreshed copy.':'The dashboard reads a separate Hyper copy. Later source changes require another extract refresh.')+'</p>';bind(extractQuery);
}
let flowState={batch:'A',ran:false};
const flowBatches={A:[['a1',' gia ',100],['a2','GIA',null],['a3','igi',200]],B:[['b1','hrd ',300],['b2',' HRD',400],['b3','gia',null]]};
function reusableFlow(action='reset'){
 if(action==='reset')flowState={batch:'A',ran:false};
 if(action==='A'||action==='B'){flowState.batch=action;flowState.ran=false;}
 if(action==='run')flowState.ran=true;
 const input=flowBatches[flowState.batch],out=input.filter(r=>r[2]!==null).map(r=>[r[0],r[1].trim().toUpperCase(),r[2]]);
 root.innerHTML='<div class="tools"><label>Input file <select id="batch"><option value="A">Batch A</option><option value="B">Batch B — same fields</option></select></label><button data-key="run">Run the saved flow</button><button data-key="reset">Reset</button></div><div class="reuse-grid"><div><h3>Input: batch '+flowState.batch+'</h3>'+table(['ID','Rater','Price'],input.map(r=>[r[0],'<code>'+r[1].replaceAll(' ','&nbsp;')+'</code>',r[2]===null?'null':r[2]]),'small')+'</div><div class="saved-flow"><span class="badge">Same saved flow</span><p>1. Trim spaces</p><p>2. Make uppercase</p><p>3. Keep valid prices</p><strong>→</strong></div><div><h3>Output: cleaned records</h3>'+(flowState.ran?table(['ID','Rater','Price'],out,'small'):'<div class="not-run">Input selected.<br>Run the flow to generate output.</div>')+'</div></div><p class="note" role="status">'+(flowState.ran?'The same three transformations produced '+out.length+' output rows. Changing the input did not require repeating each manual edit.':'A flow stores the steps—not just the final cleaned file. Reuse requires compatible fields and a valid input connection.')+'</p>';root.querySelector('#batch').value=flowState.batch;root.querySelector('#batch').onchange=e=>reusableFlow(e.target.value);bind(reusableFlow);
