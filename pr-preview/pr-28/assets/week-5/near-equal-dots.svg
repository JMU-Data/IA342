<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-label="Category dot plot of eight team percentages on a zero-to-100 scale"><title>Category dot plot of eight team percentages on a zero-to-100 scale</title><rect width="1200" height="620" fill="white"/><g font-family="Arial,sans-serif"><text x="30" y="42" font-size="28" text-anchor="start" fill="#203440" font-weight="700">Category dot plot: one summary per team</text><text x="30" y="78" font-size="18" text-anchor="start" fill="#526b79">Illustrative on-time completion percentages • the initial axis starts at zero</text><line x1="205.0" y1="106" x2="205.0" y2="530" stroke="#dae4e9" stroke-width="1"/><text x="205.0" y="563" font-size="18" text-anchor="middle" fill="#203440">0%</text><line x1="370.0" y1="106" x2="370.0" y2="530" stroke="#dae4e9" stroke-width="1"/><text x="370.0" y="563" font-size="18" text-anchor="middle" fill="#203440">20%</text><line x1="535.0" y1="106" x2="535.0" y2="530" stroke="#dae4e9" stroke-width="1"/><text x="535.0" y="563" font-size="18" text-anchor="middle" fill="#203440">40%</text><line x1="700.0" y1="106" x2="700.0" y2="530" stroke="#dae4e9" stroke-width="1"/><text x="700.0" y="563" font-size="18" text-anchor="middle" fill="#203440">60%</text><line x1="865.0" y1="106" x2="865.0" y2="530" stroke="#dae4e9" stroke-width="1"/><text x="865.0" y="563" font-size="18" text-anchor="middle" fill="#203440">80%</text><line x1="1030.0" y1="106" x2="1030.0" y2="530" stroke="#dae4e9" stroke-width="1"/><text x="1030.0" y="563" font-size="18" text-anchor="middle" fill="#203440">100%</text><text x="180" y="132" font-size="21" text-anchor="end" fill="#203440">Alpha</text><circle cx="1021.75" cy="126" r="7" fill="#276b83"/><text x="1036.75" y="132" font-size="18" text-anchor="start" fill="#203440">99%</text><text x="180" y="186" font-size="21" text-anchor="end" fill="#203440">Bravo</text><circle cx="1016.8000000000001" cy="180" r="7" fill="#276b83"/><text x="1031.8000000000002" y="186" font-size="18" text-anchor="start" fill="#203440">98.4%</text><text x="180" y="240" font-size="21" text-anchor="end" fill="#203440">Charlie</text><circle cx="1012.6750000000001" cy="234" r="7" fill="#276b83"/><text x="1027.6750000000002" y="240" font-size="18" text-anchor="start" fill="#203440">97.9%</text><text x="180" y="294" font-size="21" text-anchor="end" fill="#203440">Delta</text><circle cx="1006.0749999999999" cy="288" r="7" fill="#276b83"/><text x="1021.0749999999999" y="294" font-size="18" text-anchor="start" fill="#203440">97.1%</text><text x="180" y="348" font-size="21" text-anchor="end" fill="#203440">Echo</text><circle cx="1003.6" cy="342" r="7" fill="#276b83"/><text x="1018.6" y="348" font-size="18" text-anchor="start" fill="#203440">96.8%</text><text x="180" y="402" font-size="21" text-anchor="end" fill="#203440">Foxtrot</text><circle cx="993.6999999999999" cy="396" r="7" fill="#276b83"/><text x="1008.6999999999999" y="402" font-size="18" text-anchor="start" fill="#203440">95.6%</text><text x="180" y="456" font-size="21" text-anchor="end" fill="#203440">Golf</text><circle cx="987.1" cy="450" r="7" fill="#276b83"/><text x="1002.1" y="456" font-size="18" text-anchor="start" fill="#203440">94.8%</text><text x="180" y="510" font-size="21" text-anchor="end" fill="#203440">Hotel</text><circle cx="968.125" cy="504" r="7" fill="#276b83"/><text x="983.125" y="510" font-size="18" text-anchor="start" fill="#203440">92.5%</text><text x="600" y="609" font-size="19" text-anchor="middle" fill="#203440">Read the point’s position on the horizontal scale; do not count the dots.</text></g></svg>