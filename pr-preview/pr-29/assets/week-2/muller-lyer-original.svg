<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d">
<title id="t">Müller-Lyer illusion</title>
<desc id="d">Two vertical line segments of equal length with different arrow fins, making them appear unequal.</desc>
<rect width="1200" height="675" fill="#f7f8fa"/>
<text x="600" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="42" fill="#1f2937">Which vertical line looks longer?</text>
<g stroke="#111827" stroke-width="16" stroke-linecap="round" fill="none">
  <line x1="390" y1="190" x2="390" y2="500"/>
  <line x1="280" y1="300" x2="390" y2="190"/>
  <line x1="500" y1="300" x2="390" y2="190"/>
  <line x1="280" y1="390" x2="390" y2="500"/>
  <line x1="500" y1="390" x2="390" y2="500"/>
  <line x1="810" y1="190" x2="810" y2="500"/>
  <line x1="730" y1="110" x2="810" y2="190"/>
  <line x1="890" y1="110" x2="810" y2="190"/>
  <line x1="730" y1="580" x2="810" y2="500"/>
  <line x1="890" y1="580" x2="810" y2="500"/>
</g>
</svg>