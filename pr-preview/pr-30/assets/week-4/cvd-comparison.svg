<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">CVD comparisons</title><desc id="desc">Six colors in original sRGB and full-severity protanopia, deuteranopia and tritanopia model simulations.</desc><style>text{font-family:Arial,sans-serif;fill:#172235}.small{font-size:19px}.label{font-size:25px}.title{font-size:33px;font-weight:700}</style><rect width="1200" height="620" fill="white"/><text x="45" y="50" class="title" >One palette, three approximate CVD simulations</text><text x="40" y="133" class="label" >Original sRGB</text><rect x="270" y="95" width="123" height="75" fill="#e22049" stroke="#94a3b8"/><rect x="405" y="95" width="123" height="75" fill="#0d9e49" stroke="#94a3b8"/><rect x="540" y="95" width="123" height="75" fill="#0072b2" stroke="#94a3b8"/><rect x="675" y="95" width="123" height="75" fill="#e69f00" stroke="#94a3b8"/><rect x="810" y="95" width="123" height="75" fill="#cc79a7" stroke="#94a3b8"/><rect x="945" y="95" width="123" height="75" fill="#56b4e9" stroke="#94a3b8"/><text x="40" y="245" class="label" >protanopia</text><rect x="270" y="207" width="123" height="75" fill="#605b49" stroke="#94a3b8"/><rect x="405" y="207" width="123" height="75" fill="#9f8f41" stroke="#94a3b8"/><rect x="540" y="207" width="123" height="75" fill="#5375b5" stroke="#94a3b8"/><rect x="675" y="207" width="123" height="75" fill="#b9a200" stroke="#94a3b8"/><rect x="810" y="207" width="123" height="75" fill="#808ba9" stroke="#94a3b8"/><rect x="945" y="207" width="123" height="75" fill="#9bb3ec" stroke="#94a3b8"/><text x="40" y="357" class="label" >deuteranopia</text><rect x="270" y="319" width="123" height="75" fill="#8f8343" stroke="#94a3b8"/><rect x="405" y="319" width="123" height="75" fill="#90854f" stroke="#94a3b8"/><rect x="540" y="319" width="123" height="75" fill="#3b67b1" stroke="#94a3b8"/><rect x="675" y="319" width="123" height="75" fill="#cab411" stroke="#94a3b8"/><rect x="810" y="319" width="123" height="75" fill="#9498a5" stroke="#94a3b8"/><rect x="945" y="319" width="123" height="75" fill="#87a4e8" stroke="#94a3b8"/><text x="40" y="469" class="label" >tritanopia</text><rect x="270" y="431" width="123" height="75" fill="#f80034" stroke="#94a3b8"/><rect x="405" y="431" width="123" height="75" fill="#009b8b" stroke="#94a3b8"/><rect x="540" y="431" width="123" height="75" fill="#008289" stroke="#94a3b8"/><rect x="675" y="431" width="123" height="75" fill="#fb8c87" stroke="#94a3b8"/><rect x="810" y="431" width="123" height="75" fill="#d6788a" stroke="#94a3b8"/><rect x="945" y="431" width="123" height="75" fill="#00c2c6" stroke="#94a3b8"/><text x="40" y="585" class="small" >Machado et al. (2009), endpoint matrices in linear RGB. Approximation, not a vision test.</text></svg>