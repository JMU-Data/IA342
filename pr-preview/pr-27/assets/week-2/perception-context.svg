<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
<rect x="0" y="0" width="1200" height="675" rx="0" fill="#F7F8FA" stroke="none" stroke-width="0" opacity="1"/>
<text x="70" y="70" font-family="Inter,Arial,sans-serif" font-size="36" font-weight="700" fill="#18212F" text-anchor="start" >Perception is not a camera</text>
<text x="70" y="108" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="400" fill="#667085" text-anchor="start" >Expectation + context + prior experience shape what we see.</text>
<rect x="470" y="190" width="260" height="285" rx="24" fill="#FFFFFF" stroke="#D9DEE7" stroke-width="2" opacity="1"/>
<text x="600" y="320" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="700" fill="#26364A" text-anchor="middle" >WHAT</text>
<text x="600" y="365" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="700" fill="#26364A" text-anchor="middle" >WE SEE</text>
<rect x="55" y="200" width="230" height="60" rx="18" fill="#EDF1F7" stroke="none" stroke-width="0" opacity="1"/>
<text x="170" y="237" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" fill="#667085" text-anchor="middle" >EXPECTATION</text>
<line x1="285" y1="230" x2="485" y2="330" stroke="#667085" stroke-width="2" opacity="0.55"/>
<rect x="55" y="400" width="230" height="60" rx="18" fill="#EDF1F7" stroke="none" stroke-width="0" opacity="1"/>
<text x="170" y="437" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" fill="#667085" text-anchor="middle" >CONTEXT</text>
<line x1="285" y1="430" x2="485" y2="330" stroke="#667085" stroke-width="2" opacity="0.55"/>
<rect x="915" y="200" width="230" height="60" rx="18" fill="#EDF1F7" stroke="none" stroke-width="0" opacity="1"/>
<text x="1030" y="237" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" fill="#667085" text-anchor="middle" >PRIOR EXPERIENCE</text>
<line x1="915" y1="230" x2="715" y2="330" stroke="#667085" stroke-width="2" opacity="0.55"/>
<rect x="915" y="400" width="230" height="60" rx="18" fill="#EDF1F7" stroke="none" stroke-width="0" opacity="1"/>
<text x="1030" y="437" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" fill="#667085" text-anchor="middle" >LAYOUT</text>
<line x1="915" y1="430" x2="715" y2="330" stroke="#667085" stroke-width="2" opacity="0.55"/>
<text x="600" y="560" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="600" fill="#3559E0" text-anchor="middle" >The brain interprets what we see; it does not simply record it.</text>
</svg>