<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390">
  <rect width="1200" height="390" fill="#ffffff"/>
  <style>
    .t { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #1f2937; }
    .h { font-size: 30px; font-weight: 700; fill: #111827; }
    .l { font-size: 21px; font-weight: 700; }
    .m { font-size: 17px; fill: #4b5563; }
    .sm { font-size: 15px; fill: #047857; font-weight: 600; }
  </style>
  <text x="600" y="48" text-anchor="middle" class="t h">Geocoding: from text to a verified location</text>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3.5" orient="auto">
      <polygon points="0 0, 8 3.5, 0 7" fill="#64748b"/>
    </marker>
  </defs>
  <!-- Box 1: Address -->
  <rect x="60" y="85" width="225" height="195" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="172.5" y="132" text-anchor="middle" class="t l">1. Address</text>
  <text x="172.5" y="190" text-anchor="middle" class="t m">123 Main Street</text>
  <!-- Arrow 1 -->
  <line x1="295" y1="182" x2="335" y2="182" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
  <!-- Box 2: Match -->
  <rect x="345" y="85" width="225" height="195" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="457.5" y="132" text-anchor="middle" class="t l">2. Match</text>
  <text x="457.5" y="190" text-anchor="middle" class="t m">candidate location</text>
  <!-- Arrow 2 -->
  <line x1="580" y1="182" x2="620" y2="182" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
  <!-- Box 3: Coordinate -->
  <rect x="630" y="85" width="225" height="195" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="742.5" y="132" text-anchor="middle" class="t l">3. Coordinate</text>
  <text x="742.5" y="190" text-anchor="middle" class="t m">38.45, −78.87</text>
  <!-- Arrow 3 -->
  <line x1="865" y1="182" x2="905" y2="182" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
  <!-- Box 4: Check -->
  <rect x="915" y="85" width="225" height="195" rx="16" fill="#ecfdf5" stroke="#86efac" stroke-width="2"/>
  <text x="1027.5" y="132" text-anchor="middle" class="t l">4. Check</text>
  <circle cx="1027.5" cy="182" r="25" fill="#0f766e"/>
  <path d="M1017 182 l7 7 l15 -17" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1027.5" y="244" text-anchor="middle" class="t sm">reasonable place?</text>
  <!-- Bottom note -->
  <text x="600" y="340" text-anchor="middle" class="t m">Geocoding is not finished until the returned location is checked.</text>
</svg>