<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Geographic versus projected coordinate systems</title>
<desc id="desc">Geographic versus projected coordinate systems</desc>
<defs>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#101828" flood-opacity="0.10"/></filter>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L12,6 L0,12 z" fill="#667085"/></marker>
  <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L12,6 L0,12 z" fill="#3559E0"/></marker>
</defs>
<rect width="1200" height="675" fill="#F7F8FA"/>
<text x="70" y="68" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="700" fill="#18212F" text-anchor="start" opacity="1.0">Geographic and projected coordinate systems serve different jobs</text>
<text x="70" y="103" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="400" fill="#667085" text-anchor="start" opacity="1.0">Use latitude/longitude to locate; use an appropriate projection to measure.</text>
<rect x="70" y="175" width="485" height="390" rx="22" fill="#FFFFFF" stroke="#D9DEE7" stroke-width="2" opacity="1.0" filter="url(#shadow)"/><rect x="140" y="215" width="345" height="42" rx="21" fill="#EAF0FF" stroke="#EAF0FF" stroke-width="0" opacity="1.0"/><text x="312.5" y="243" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" fill="#3559E0" text-anchor="middle" opacity="1.0">Geographic coordinate system</text>
<circle cx="312" cy="350" r="100" fill="#FFFFFF" stroke="#3559E0" stroke-width="3" opacity="1.0"/><ellipse cx="312" cy="350" rx="32" ry="100" fill="none" stroke="#D9DEE7" stroke-width="2"/><ellipse cx="312" cy="350" rx="62" ry="100" fill="none" stroke="#D9DEE7" stroke-width="2"/><ellipse cx="312" cy="315" rx="93.7" ry="18" fill="none" stroke="#D9DEE7" stroke-width="2"/><ellipse cx="312" cy="350" rx="100.0" ry="18" fill="none" stroke="#D9DEE7" stroke-width="2"/><ellipse cx="312" cy="385" rx="93.7" ry="18" fill="none" stroke="#D9DEE7" stroke-width="2"/><text x="312" y="485" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="800" fill="#3559E0" text-anchor="middle" opacity="1.0">Units: degrees</text>
<text x="312" y="520" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="500" fill="#667085" text-anchor="middle" opacity="1.0">Best for global location</text>
<rect x="645" y="175" width="485" height="390" rx="22" fill="#FFFFFF" stroke="#D9DEE7" stroke-width="2" opacity="1.0" filter="url(#shadow)"/><rect x="715" y="215" width="345" height="42" rx="21" fill="#E6F7F7" stroke="#E6F7F7" stroke-width="0" opacity="1.0"/><text x="887.5" y="243" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" fill="#00A6A6" text-anchor="middle" opacity="1.0">Projected coordinate system</text>
<line x1="735" y1="290" x2="735" y2="455" stroke="#D9DEE7" stroke-width="2" opacity="1.0"/><line x1="805" y1="290" x2="805" y2="455" stroke="#D9DEE7" stroke-width="2" opacity="1.0"/><line x1="875" y1="290" x2="875" y2="455" stroke="#D9DEE7" stroke-width="2" opacity="1.0"/><line x1="945" y1="290" x2="945" y2="455" stroke="#D9DEE7" stroke-width="2" opacity="1.0"/><line x1="1015" y1="290" x2="1015" y2="455" stroke="#D9DEE7" stroke-width="2" opacity="1.0"/><line x1="1085" y1="290" x2="1085" y2="455" stroke="#D9DEE7" stroke-width="2" opacity="1.0"/><line x1="735" y1="290" x2="1085" y2="290" stroke="#D9DEE7" stroke-width="2" opacity="1.0"/><line x1="735" y1="331" x2="1085" y2="331" stroke="#D9DEE7" stroke-width="2" opacity="1.0"/><line x1="735" y1="372" x2="1085" y2="372" stroke="#D9DEE7" stroke-width="2" opacity="1.0"/><line x1="735" y1="413" x2="1085" y2="413" stroke="#D9DEE7" stroke-width="2" opacity="1.0"/><line x1="735" y1="454" x2="1085" y2="454" stroke="#D9DEE7" stroke-width="2" opacity="1.0"/><path d="M760 420 C820 360 860 400 910 330 C960 285 1010 350 1060 310" fill="none" stroke="#00A6A6" stroke-width="8" opacity="1.0"/><text x="887" y="485" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="800" fill="#00A6A6" text-anchor="middle" opacity="1.0">Units: meters or feet</text>
<text x="887" y="520" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="500" fill="#667085" text-anchor="middle" opacity="1.0">Better for distance and area</text>
</svg>
