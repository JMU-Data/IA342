<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <rect width="1200" height="675" fill="#f7f9fc"/>
  <text x="70" y="75" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" fill="#17324d">Decoration vs. Information</text>
  <text x="70" y="115" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#52677c">A synthetic example — the number is illustrative, not a real survey result</text>

  <g transform="translate(80,155)">
    <rect x="0" y="0" width="480" height="420" rx="20" fill="#ffffff" stroke="#d8e1ea" stroke-width="2"/>
    <text x="25" y="42" font-family="Arial" font-size="26" font-weight="700" fill="#17324d">BEFORE: looks nice, tells little</text>
    <circle cx="240" cy="190" r="108" fill="none" stroke="#e9eef3" stroke-width="50"/>
    <circle cx="240" cy="190" r="108" fill="none" stroke="#3f7cac" stroke-width="50" stroke-linecap="round" stroke-dasharray="516 679" transform="rotate(-90 240 190)"/>
    <text x="240" y="208" text-anchor="middle" font-family="Arial" font-size="62" font-weight="800" fill="#17324d">76%</text>
    <g fill="#b8c5d1">
      <circle cx="90" cy="330" r="18"/><circle cx="130" cy="326" r="12"/><rect x="165" y="300" width="70" height="48" rx="6"/>
      <polygon points="270,348 315,298 360,348"/><rect x="285" y="320" width="60" height="35" rx="4"/>
      <circle cx="400" cy="327" r="22"/><rect x="398" y="328" width="5" height="30"/>
    </g>
    <text x="240" y="392" text-anchor="middle" font-family="Arial" font-size="18" fill="#687d90">Looks nice, but what does 76% mean?</text>
  </g>

  <g transform="translate(640,155)">
    <rect x="0" y="0" width="480" height="420" rx="20" fill="#ffffff" stroke="#d8e1ea" stroke-width="2"/>
    <text x="25" y="42" font-family="Arial" font-size="26" font-weight="700" fill="#17324d">AFTER: adds context</text>
    <text x="25" y="88" font-family="Arial" font-size="20" fill="#52677c">Illustrative survey result</text>
    <text x="25" y="125" font-family="Arial" font-size="18" fill="#6b7f91">Question: Which option do you prefer?</text>
    <text x="25" y="158" font-family="Arial" font-size="18" fill="#6b7f91">Sample: n = 500 (synthetic)</text>
    <text x="25" y="206" font-family="Arial" font-size="18" font-weight="700" fill="#17324d">Option A</text>
    <rect x="130" y="184" width="290" height="30" rx="5" fill="#e8eef4"/>
    <rect x="130" y="184" width="220" height="30" rx="5" fill="#3f7cac"/>
    <text x="430" y="206" font-family="Arial" font-size="18" font-weight="700" fill="#17324d">76%</text>
    <text x="25" y="270" font-family="Arial" font-size="18" font-weight="700" fill="#17324d">Other</text>
    <rect x="130" y="248" width="290" height="30" rx="5" fill="#e8eef4"/>
    <rect x="130" y="248" width="70" height="30" rx="5" fill="#87a9c2"/>
    <text x="430" y="270" font-family="Arial" font-size="18" font-weight="700" fill="#17324d">24%</text>
    <text x="25" y="335" font-family="Arial" font-size="17" fill="#52677c">Now we know the question, sample size, and comparison.</text>
    <text x="25" y="372" font-family="Arial" font-size="16" fill="#7b8c9c">Source: synthetic classroom example</text>
  </g>

  <text x="600" y="625" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#17324d">The point is the change from BEFORE to AFTER: context makes the number useful.</text>
</svg>