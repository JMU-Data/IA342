<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Müller-Lyer Experiment — IA 342</title>
<style>
:root { font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; color: #111827; background: #f8fafc; }
* { box-sizing: border-box; }
body { margin: 0; padding: 12px; min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; }
.card { width: min(880px, 98%); background: #fff; border: 1px solid #d1d5db; border-radius: 14px; padding: 16px 20px; box-shadow: 0 4px 16px rgba(0,0,0,0.06); text-align: center; }
h1 { font-size: 22px; margin: 0 0 4px; color: #0f172a; }
p { font-size: 14px; color: #4b5563; margin: 0 0 10px; }
svg { width: 100%; max-height: 280px; height: auto; display: block; margin: 0 auto; }
.controls { margin-top: 10px; display: flex; gap: 10px; justify-content: center; }
button { font-size: 14px; font-weight: 700; padding: 8px 16px; border-radius: 8px; border: 1px solid #9ca3af; background: #0969da; color: #fff; cursor: pointer; transition: background 0.15s; }
button:hover { background: #0858b9; }
button.secondary { background: #e2e8f0; color: #1e293b; border-color: #cbd5e1; }
button.secondary:hover { background: #cbd5e1; }
.reveal { opacity: 0; transition: opacity 0.25s; }
.shown .reveal { opacity: 1; }
.answer { font-weight: 700; color: #0f172a; min-height: 22px; margin-top: 8px; font-size: 14px; }
</style>
</head>
<body>
<div class="card" id="demo">
  <h1>Which vertical line is longer?</h1>
  <p>Make your guess before clicking the reveal button below.</p>
  <svg viewBox="0 0 900 480" aria-label="Müller-Lyer illusion">
    <g stroke="#111827" stroke-width="12" stroke-linecap="round" fill="none">
      <line x1="280" y1="110" x2="280" y2="370"/>
      <line x1="190" y1="200" x2="280" y2="110"/><line x1="370" y1="200" x2="280" y2="110"/>
      <line x1="190" y1="280" x2="280" y2="370"/><line x1="370" y1="280" x2="280" y2="370"/>
      <line x1="620" y1="110" x2="620" y2="370"/>
      <line x1="555" y1="45" x2="620" y2="110"/><line x1="685" y1="45" x2="620" y2="110"/>
      <line x1="555" y1="435" x2="620" y2="370"/><line x1="685" y1="435" x2="620" y2="370"/>
    </g>
    <g class="reveal" stroke="#e11d48" stroke-width="4" stroke-dasharray="10 8">
      <line x1="120" y1="110" x2="780" y2="110"/>
      <line x1="120" y1="370" x2="780" y2="370"/>
    </g>
  </svg>
  <div class="controls">
    <button onclick="document.getElementById('demo').classList.add('shown');document.getElementById('ans').textContent='Both vertical segments are mathematically identical in length.'">Reveal measurement</button>
    <button class="secondary" onclick="document.getElementById('demo').classList.remove('shown');document.getElementById('ans').textContent=''">Reset</button>
  </div>
  <div id="ans" class="answer"></div>
</div>
</body>
</html>
