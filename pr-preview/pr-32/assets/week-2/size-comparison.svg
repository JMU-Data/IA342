<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
<rect x="0" y="0" width="1200" height="675" rx="0" fill="#F7F8FA" stroke="none" stroke-width="0" opacity="1"/>
<text x="70" y="70" font-family="Inter,Arial,sans-serif" font-size="36" font-weight="700" fill="#18212F" text-anchor="start" >Size is noticeable—but imprecise</text>
<text x="70" y="108" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="400" fill="#667085" text-anchor="start" >Area judgments are harder than position or length judgments.</text>
<circle cx="235" cy="325" r="26" fill="#3559E0" stroke="none" stroke-width="0" opacity="0.82"/>
<text x="235" y="430" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="600" fill="#667085" text-anchor="middle" >676</text>
<circle cx="435" cy="325" r="36" fill="#3559E0" stroke="none" stroke-width="0" opacity="0.82"/>
<text x="435" y="430" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="600" fill="#667085" text-anchor="middle" >1296</text>
<circle cx="655" cy="325" r="47" fill="#3559E0" stroke="none" stroke-width="0" opacity="0.82"/>
<text x="655" y="430" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="600" fill="#667085" text-anchor="middle" >2209</text>
<circle cx="895" cy="325" r="60" fill="#3559E0" stroke="none" stroke-width="0" opacity="0.82"/>
<text x="895" y="430" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="600" fill="#667085" text-anchor="middle" >3600</text>
<text x="600" y="505" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="600" fill="#18212F" text-anchor="middle" >Can you estimate the exact ratios without labels?</text>
<text x="600" y="548" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="400" fill="#667085" text-anchor="middle" >You can see “bigger” quickly; exact magnitude is much harder.</text>
</svg>