<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Standard deviation classification concept</title><desc id="desc">A normal distribution with class ranges measured in standard deviations from the mean.</desc>
<rect width="1200" height="675" fill="#F7F8FA"/>
<text x="70" y="68" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="700" fill="#18212F">Standard deviation</text>
<text x="70" y="103" font-family="Inter,Arial,sans-serif" font-size="18" fill="#667085">Classes show how far values fall above or below the mean.</text>
<path d="M125 445 C225 445 300 430 380 345 C455 265 500 220 600 220 C700 220 745 265 820 345 C900 430 975 445 1075 445" fill="none" stroke="#7047B8" stroke-width="5"/>
<rect x="150" y="455" width="170" height="70" fill="#EAF0FF"/><rect x="320" y="455" width="170" height="70" fill="#E6F7F7"/><rect x="490" y="455" width="220" height="70" fill="#EAF6EF"/><rect x="710" y="455" width="170" height="70" fill="#FFF2E8"/><rect x="880" y="455" width="170" height="70" fill="#FCECEC"/>
<g font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#18212F" text-anchor="middle">
<text x="235" y="498">≤ −2 SD</text><text x="405" y="498">−2 to −1</text><text x="600" y="498">−1 to +1</text><text x="795" y="498">+1 to +2</text><text x="965" y="498">≥ +2 SD</text></g>
<g stroke-width="2" stroke-dasharray="8 6"><line x1="320" y1="190" x2="320" y2="540" stroke="#3559E0"/><line x1="490" y1="190" x2="490" y2="540" stroke="#00A6A6"/><line x1="600" y1="170" x2="600" y2="540" stroke="#248A52" stroke-width="4"/><line x1="710" y1="190" x2="710" y2="540" stroke="#E07A2D"/><line x1="880" y1="190" x2="880" y2="540" stroke="#C2413B"/></g>
<g font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" text-anchor="middle"><text x="320" y="175" fill="#3559E0">−2 SD</text><text x="490" y="175" fill="#00A6A6">−1 SD</text><text x="600" y="150" fill="#248A52">Mean</text><text x="710" y="175" fill="#E07A2D">+1 SD</text><text x="880" y="175" fill="#C2413B">+2 SD</text></g>
<rect x="315" y="570" width="570" height="42" rx="21" fill="#F2ECFA"/><text x="600" y="598" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" fill="#7047B8" text-anchor="middle">Good for showing unusual distance from the average</text>
<text x="600" y="640" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="600" fill="#667085" text-anchor="middle">In Business Analyst, inspect this idea with the histogram and SD-based themes.</text>
</svg>