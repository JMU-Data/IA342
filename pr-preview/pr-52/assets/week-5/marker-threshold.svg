<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-label="Large endpoints can look like values beyond a threshold"><title>Large endpoints can look like values beyond a threshold</title><rect width="1200" height="620" fill="white"/><g font-family="Arial, sans-serif" fill="#173442"><text x="36" y="44" font-size="27" fill="#173442" text-anchor="start" font-weight="700">Large endpoints can look like values beyond a threshold</text><text x="36" y="76" font-size="17" fill="#5E707A" text-anchor="start">Illustrative scores • true dot centers are at 78 and 82</text><text x="42" y="200" font-size="24" fill="#173442" text-anchor="start" font-weight="700">Oversized markers</text><line x1="240" y1="215" x2="240" y2="325" stroke="#DBE4E8" stroke-width="2"/><text x="240" y="355" font-size="20" fill="#173442" text-anchor="middle">60</text><line x1="430" y1="215" x2="430" y2="325" stroke="#DBE4E8" stroke-width="2"/><text x="430" y="355" font-size="20" fill="#173442" text-anchor="middle">70</text><line x1="620" y1="215" x2="620" y2="325" stroke="#DBE4E8" stroke-width="2"/><text x="620" y="355" font-size="20" fill="#173442" text-anchor="middle">80</text><line x1="810" y1="215" x2="810" y2="325" stroke="#DBE4E8" stroke-width="2"/><text x="810" y="355" font-size="20" fill="#173442" text-anchor="middle">90</text><line x1="1000" y1="215" x2="1000" y2="325" stroke="#DBE4E8" stroke-width="2"/><text x="1000" y="355" font-size="20" fill="#173442" text-anchor="middle">100</text><line x1="620" y1="185" x2="620" y2="340" stroke="#173442" stroke-width="3" stroke-dasharray="8 7"/><line x1="240" y1="235" x2="582" y2="235" stroke="#276B83" stroke-width="3"/><circle cx="582" cy="235" r="30" fill="#276B83"/><line x1="240" y1="300" x2="658" y2="300" stroke="#DD8751" stroke-width="3"/><circle cx="658" cy="300" r="30" fill="#DD8751"/><text x="42" y="390" font-size="24" fill="#173442" text-anchor="start" font-weight="700">Smaller markers</text><line x1="240" y1="405" x2="240" y2="515" stroke="#DBE4E8" stroke-width="2"/><text x="240" y="545" font-size="20" fill="#173442" text-anchor="middle">60</text><line x1="430" y1="405" x2="430" y2="515" stroke="#DBE4E8" stroke-width="2"/><text x="430" y="545" font-size="20" fill="#173442" text-anchor="middle">70</text><line x1="620" y1="405" x2="620" y2="515" stroke="#DBE4E8" stroke-width="2"/><text x="620" y="545" font-size="20" fill="#173442" text-anchor="middle">80</text><line x1="810" y1="405" x2="810" y2="515" stroke="#DBE4E8" stroke-width="2"/><text x="810" y="545" font-size="20" fill="#173442" text-anchor="middle">90</text><line x1="1000" y1="405" x2="1000" y2="515" stroke="#DBE4E8" stroke-width="2"/><text x="1000" y="545" font-size="20" fill="#173442" text-anchor="middle">100</text><line x1="620" y1="375" x2="620" y2="530" stroke="#173442" stroke-width="3" stroke-dasharray="8 7"/><line x1="240" y1="425" x2="582" y2="425" stroke="#276B83" stroke-width="3"/><circle cx="582" cy="425" r="7" fill="#276B83"/><line x1="240" y1="490" x2="658" y2="490" stroke="#DD8751" stroke-width="3"/><circle cx="658" cy="490" r="7" fill="#DD8751"/><text x="36" y="598" font-size="17" fill="#5E707A" text-anchor="start">Read the marker center, not its outer edge. Use the same endpoint size for all values.</text></g></svg>