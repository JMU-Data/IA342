<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#fff"/><style>.t{font-family:Arial,Helvetica,sans-serif;fill:#1f2937}.h{font-size:34px;font-weight:700}.l{font-size:22px;font-weight:700}.m{font-size:18px}.sm{font-size:15px;fill:#4b5563}</style><text x="60" y="58" class="t h">Zoom changes map scale</text><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker></defs><g transform="translate(70,165)"><rect width="300" height="330" rx="18" fill="#eef2f7" stroke="#cbd5e1"/><path d="M25 230 C85 180 120 205 170 155 S260 110 278 55" fill="none" stroke="#94a3b8" stroke-width="6"/><circle cx="165" cy="170" r="14" fill="#ef4444"/><text x="150" y="285" text-anchor="middle" class="t l">Small scale</text><text x="150" y="314" text-anchor="middle" class="t sm">larger area • less detail</text><line x1="320" y1="165" x2="430" y2="165" stroke="#475569" stroke-width="4" marker-end="url(#a)"/><text x="375" y="145" text-anchor="middle" class="t m">ZOOM IN</text><rect x="450" width="300" height="330" rx="18" fill="#f8fafc" stroke="#cbd5e1"/><path d="M480 230 C540 185 590 205 640 152 S700 115 730 80" fill="none" stroke="#94a3b8" stroke-width="8"/><path d="M500 75 L700 260 M505 250 L710 50" stroke="#cbd5e1" stroke-width="3"/><circle cx="635" cy="165" r="16" fill="#ef4444"/><text x="600" y="285" text-anchor="middle" class="t l">Medium scale</text><text x="600" y="314" text-anchor="middle" class="t sm">smaller area • more detail</text><line x1="770" y1="165" x2="880" y2="165" stroke="#475569" stroke-width="4" marker-end="url(#a)"/><text x="825" y="145" text-anchor="middle" class="t m">ZOOM IN</text><rect x="900" width="230" height="330" rx="18" fill="#f8fafc" stroke="#cbd5e1"/><path d="M930 225 L1100 225 M930 175 L1100 175 M930 125 L1100 125 M970 50 L970 280 M1030 50 L1030 280 M1090 50 L1090 280" stroke="#cbd5e1" stroke-width="4"/><rect x="990" y="140" width="45" height="45" fill="#dbeafe" stroke="#60a5fa"/><circle cx="1014" cy="162" r="14" fill="#ef4444"/><text x="1015" y="285" text-anchor="middle" class="t l">Large scale</text><text x="1015" y="314" text-anchor="middle" class="t sm">small area • high detail</text></g><text x="600" y="555" text-anchor="middle" class="t m">Large scale means a larger representative fraction, not a larger geographic area.</text></svg>