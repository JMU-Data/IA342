function regression(rows){const xs=rows.map(r=>r.WEIGHT),ys=rows.map(r=>r.PRICE),mx=mean(xs),my=mean(ys);const xx=sum(xs.map(x=>(x-mx)**2)),xy=sum(xs.map((x,i)=>(x-mx)*(ys[i]-my))),yy=sum(ys.map(y=>(y-my)**2));const b=xy/xx,a=my-b*mx,r2=xy*xy/(xx*yy);return{a,b,r2}}
function trend(){app.innerHTML=title('Trend and reference lines')+`<div class="controls"><label>RATER ${select('rater',[['All','All'],['GIA','GIA'],['HRD','HRD'],['IGI','IGI']],'All')}</label><label><input id="fit" type="checkbox" checked> Linear fit</label><label><input id="reference" type="checkbox"> Mean-price reference</label></div><div class="chart" id="plot"></div><div class="status" aria-live="polite"></div>`;function render(){const rows=D.filter(r=>q('#rater').value==='All'||r.RATER===q('#rater').value),fit=regression(rows);framePlot(q('#plot'),rows.map(r=>({k:r.IDNO,x:r.WEIGHT,y:r.PRICE,r:3.6,tip:'ID '+r.IDNO+' · PRICE '+fmt(r.PRICE)})),{xmax:1.2,ymax:17500,xdigits:2,xlabel:'WEIGHT',ylabel:'PRICE',trend:q('#fit').checked?fit:undefined,ref:q('#reference').checked?mean(rows.map(r=>r.PRICE)):undefined,refLabel:'Mean PRICE'});status(`${rows.length} records. `+(q('#fit').checked?`Fitted PRICE = ${fmt(fit.a,1)} + ${fmt(fit.b,1)} × WEIGHT; R² = ${fmt(fit.r2,3)}. `:'')+(q('#reference').checked?`Reference = ${fmt(mean(rows.map(r=>r.PRICE)),2)}.`:''))}['#rater','#fit','#reference'].forEach(s=>q(s).onchange=render);render()}

function tooltipDemo(){const rows=[{name:'County A',v:[10,35,20,15]},{name:'County B',v:[25,15,40,20]},{name:'County C',v:[5,20,15,50]}];let idx=0,filter=true;app.innerHTML=title('Viz in Tooltip: source → target','Illustrative weekly values, not COVID observations')+`<div class="controls"><label><input type="checkbox" id="filter" checked> Pass the hovered county to the target</label></div><div class="tooltip-demo"><div><b>Source: county totals</b><div id="sources"></div></div><div class="tipbox"><h3 id="tipname"></h3><div id="tipchart"></div><p id="tipnote"></p></div></div><div class="status" aria-live="polite"></div>`;q('#sources').innerHTML=rows.map((r,i)=>`<button class="location" data-i="${i}">${r.name} · ${sum(r.v)}<span class="fill" style="width:${sum(r.v)}%"></span></button>`).join('');function render(){const r=rows[idx],v=filter?r.v:[0,1,2,3].map(i=>sum(rows.map(r=>r.v[i])));q('#tipname').textContent=filter?r.name+' · weekly values':'All counties · weekly values';const pts=v.map((x,i)=>`${25+i*70},${150-x*1.1}`);q('#tipchart').innerHTML=`<svg viewBox="0 0 260 190" role="img" aria-label="Weekly values for ${filter?r.name:'all counties'}"><line class="axis" x1="25" y1="150" x2="242" y2="150"/><polyline class="line" points="${pts.join(' ')}"/>${v.map((x,i)=>`<circle cx="${25+i*70}" cy="${150-x*1.1}" r="4" fill="#17688f"/><text class="plot-label" x="${25+i*70}" y="${140-x*1.1}" text-anchor="middle">${x}</text><text class="plot-label" x="${25+i*70}" y="174" text-anchor="middle">W${i+1}</text>`).join('')}</svg>`;q('#tipnote').textContent='Hover, click or keyboard-focus another source bar.';status(filter?'The source passes a county identity; the target recomputes the weekly series for that county.':'Without the county filter, every source bar shows the same all-county series.')}qa('[data-i]').forEach(b=>{const update=()=>{idx=Number(b.dataset.i);render()};b.onmouseenter=update;b.onfocus=update;b.onclick=update});q('#filter').onchange=()=>{filter=q('#filter').checked;render()};render()}
const M=[160,180,220,260,300,280,320,350,310,360,390,470,190,230,250,300,340,320,370,390,360,420,450,580].map((v,i)=>({year:2024+Math.floor(i/12),month:i%12+1,sales:v}));

function idDisplay(){
 let lineBoth=false;
 const rows=D.filter(r=>r.IDNO>=1 && r.IDNO<=8).sort((a,b)=>a.IDNO-b.IDNO);
 app.innerHTML=title('One numeric dimension, two display settings','Course Diamonds · fixed records ID 1–8')+`<div class="controls"><label><input id="sameMarks" type="checkbox"> Line marks on both sides</label></div><div class="compare-panels"><article><h3>Discrete · separate headers</h3><div class="example-shelf"><b>Columns</b><span class="pill">IDNO</span></div><div class="example-shelf"><b>Rows</b><span class="pill green">AVG(PRICE)</span></div><div id="discretePlot"></div><p class="panel-caption" id="discreteCaption"></p></article><article><h3>Continuous · numeric axis</h3><div class="example-shelf"><b>Columns</b><span class="pill green">IDNO</span></div><div class="example-shelf"><b>Rows</b><span class="pill green">AVG(PRICE)</span></div><div id="continuousPlot"></div><p class="panel-caption">IDNO stays a dimension; its positions use a numeric scale.</p></article></div><div class="status" aria-live="polite"></div>`;
 function draw(host,rows,continuous,line){
  const W=520,H=230,L=55,R=16,T=24,B=47,pw=W-L-R,ph=H-T-B,max=Math.ceil(Math.max(...rows.map(r=>r.PRICE))/1000)*1000;
  const lo=Math.min(...rows.map(r=>r.IDNO)),hi=Math.max(...rows.map(r=>r.IDNO));
  const x=(r,i)=>continuous?L+9+(r.IDNO-lo)/(hi-lo)*(pw-18):L+(i+.5)*pw/rows.length;
  const y=v=>H-B-v/max*ph;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${continuous?'Continuous IDNO numeric axis':'Discrete IDNO headers'}; ${line?'Line':'Bar'} marks"><text class="plot-title" x="${L}" y="14">AVG(PRICE)</text>`;
  for(let i=0;i<=4;i++){const yy=y(max*i/4);s+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}"/><text class="plot-label" x="${L-6}" y="${yy+4}" text-anchor="end">${fmt(max*i/4)}</text>`;}
  if(continuous)s+=`<line class="axis" x1="${L}" x2="${W-R}" y1="${H-B}" y2="${H-B}"/>`;
  if(line)s+=`<polyline fill="none" stroke="#17688f" stroke-width="2.3" points="${rows.map((r,i)=>x(r,i)+','+y(r.PRICE)).join(' ')}"/>`;
  rows.forEach((r,i)=>{const xx=x(r,i),yy=y(r.PRICE),bw=pw/rows.length*.6;
   s+=line?`<circle data-id="${r.IDNO}" data-price="${r.PRICE}" data-x="${xx}" cx="${xx}" cy="${yy}" r="4" fill="#17688f"><title>ID ${r.IDNO}: ${fmt(r.PRICE)}</title></circle>`:`<rect data-id="${r.IDNO}" data-price="${r.PRICE}" data-x="${xx}" x="${xx-bw/2}" y="${yy}" width="${bw}" height="${H-B-yy}" fill="#17688f"><title>ID ${r.IDNO}: ${fmt(r.PRICE)}</title></rect>`;
   if(!continuous)s+=`<text class="plot-label" x="${xx}" y="${H-B+20}" text-anchor="middle">${r.IDNO}</text>`;
  });
  if(continuous){const ticks=rows.map(r=>r.IDNO);ticks.forEach(v=>s+=`<text class="plot-label" x="${x({IDNO:v},0)}" y="${H-B+20}" text-anchor="middle">${v}</text>`);}
  s+=`<text class="plot-title" x="${L+pw/2}" y="${H-6}" text-anchor="middle">${continuous?'IDNO · axis':'IDNO · headers'}</text></svg>`;
  host.innerHTML=s;
 }
 function render(){draw(q('#discretePlot'),rows,false,lineBoth);draw(q('#continuousPlot'),rows,true,true);q('#discreteCaption').textContent=lineBoth?'Line marks can also connect positions under discrete headers.':'Each ID has its own header. Bar marks emphasize separate categories.';status(`Same ${rows.length} records and prices. ID-to-PRICE values stay fixed. Blue/green changes headers versus an axis; Bar/Line changes the marks. ID numbers are identifiers, not a time trend.`);}
 q('#sameMarks').onchange=e=>{lineBoth=e.target.checked;render()};render();
}

function weekdayDates(){
 const sales=[100,120,80,160,200,180,90,150,110,90,170,180,200,130,160,130,100,210,220,240,140],names=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
 const all=sales.map((v,i)=>({i,date:new Date(Date.UTC(2026,9,5+i)),v,weekday:i%7}));let weeks=2,mondays=false;
 app.innerHTML=title('Weekday categories versus actual dates','Synthetic daily sales; one row per date')+`<div class="controls">${btns([['2','2 weeks'],['3','3 weeks']],'2')}<label><input id="mondays" type="checkbox"> Emphasize Mondays</label></div><div class="compare-panels"><article><h3>Weekday date part</h3><div class="example-shelf"><b>Columns</b><span class="pill">WEEKDAY(Order Date)</span></div><div class="example-shelf"><b>Rows</b><span class="pill green">SUM(Sales)</span></div><div id="weekdaysPlot"></div><p class="panel-caption"><b id="weekdayCount"></b> · all Mondays form one group.</p></article><article><h3>Continuous daily date value</h3><div class="example-shelf"><b>Columns</b><span class="pill green">DAY(Order Date)</span></div><div class="example-shelf"><b>Rows</b><span class="pill green">SUM(Sales)</span></div><div id="daysPlot"></div><p class="panel-caption"><b id="dailyCount"></b> · each Monday has a different date.</p></article></div><div class="status" aria-live="polite"></div>`;
 function draw(host,rows,continuous,max){
  const W=520,H=230,L=48,R=14,T=15,B=50,w=W-L-R,h=H-T-B,x=i=>continuous?L+8+i/(rows.length-1)*(w-16):L+(i+.5)*w/rows.length,y=v=>H-B-v/max*h;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${continuous?'Daily sales across dated Mondays, Tuesdays and other days':'Sales aggregated by seven weekday categories'}">`;
  for(let i=0;i<=4;i++){const yy=y(max*i/4);s+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}"/><text class="plot-label" x="${L-5}" y="${yy+4}" text-anchor="end">${fmt(max*i/4)}</text>`;}
  if(continuous)s+=`<line class="axis" x1="${L}" x2="${W-R}" y1="${H-B}" y2="${H-B}"/><polyline fill="none" stroke="#839cab" stroke-width="2" points="${rows.map((r,i)=>x(i)+','+y(r.v)).join(' ')}"/>`;
  rows.forEach((r,i)=>{const xx=x(i),yy=y(r.v),color=mondays&&r.weekday===0?'#bb662c':'#17688f',date=continuous?r.date.toISOString().slice(0,10):names[r.weekday];
   s+=continuous?`<circle data-date="${date}" data-value="${r.v}" cx="${xx}" cy="${yy}" r="${mondays&&r.weekday===0?5.5:3.5}" fill="${color}"><title>${names[r.weekday]} ${date}: ${r.v}</title></circle>`:`<rect data-weekday="${names[r.weekday]}" data-value="${r.v}" x="${xx-w/rows.length*.31}" y="${yy}" width="${w/rows.length*.62}" height="${H-B-yy}" fill="${color}"><title>${date}: ${r.v}</title></rect>`;
   if(!continuous)s+=`<text class="plot-label" x="${xx}" y="${H-B+18}" text-anchor="middle">${names[r.weekday]}</text>`;
   else if(r.weekday===0||i===rows.length-1)s+=`<text class="plot-label" x="${xx}" y="${H-B+18}" text-anchor="${i===0?'start':i===rows.length-1?'end':'middle'}">Oct ${r.date.getUTCDate()}</text><text class="plot-label" x="${xx}" y="${H-B+33}" text-anchor="${i===0?'start':i===rows.length-1?'end':'middle'}">${names[r.weekday]}</text>`;
  });host.innerHTML=s+'</svg>';
 }
 function render(){const rows=all.slice(0,weeks*7),grouped=names.map((name,j)=>({weekday:j,v:sum(rows.filter(r=>r.weekday===j).map(r=>r.v))})),max=Math.ceil(Math.max(...grouped.map(r=>r.v))/100)*100;draw(q('#weekdaysPlot'),grouped,false,max);draw(q('#daysPlot'),rows,true,max);q('#weekdayCount').textContent='7 groups';q('#dailyCount').textContent=rows.length+' dates';const mon=rows.filter(r=>r.weekday===0);status(`${rows.length} source rows · total Sales = ${fmt(sum(rows.map(r=>r.v)))} in either view. Monday group: ${mon.map(r=>r.v).join(' + ')} = ${sum(mon.map(r=>r.v))}; timeline: ${mon.map(r=>'Oct '+r.date.getUTCDate()).join(', ')} stay separate.`);setPressed(String(weeks));}
 qa('[data-v]').forEach(b=>b.onclick=()=>{weeks=Number(b.dataset.v);render()});q('#mondays').onchange=e=>{mondays=e.target.checked;render()};render();
}

function dateHierarchy(){
 let level=0;
 app.innerHTML=title('Date hierarchy','Synthetic monthly sales, 2024–2025')+`<div class="controls"><button id="up">− Drill up</button><button id="down">+ Drill down</button></div><div id="dateShelves"></div><div class="chart" id="bars"></div><div class="status" aria-live="polite"></div>`;

  for(let i=0;i<=4;i++){const yy=y(max*i/4);s+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}"/><text class="plot-label" x="${L-6}" y="${yy+4}" text-anchor="end">${fmt(max*i/4)}</text>`;}

  s+=`<text class="plot-title" x="${L+w/2}" y="${H-6}" text-anchor="middle">${nested?'YEAR → MONTH headers':'MONTH headers'}</text></svg>`;q('#monthHeaderPlot').innerHTML=s;status(`${rows.length} groups · total Sales ${fmt(sum(M.map(r=>r.sales)))}. ${nested?'2024 → Jan = 160; 2025 → Jan = 190. Separate Year and Month pills create nested headers.':'Jan = 160 + 190 = 350. With only MONTH on Columns, the year does not separate groups.'} Both views are discrete.`);setPressed(nested?'nested':'month');}
